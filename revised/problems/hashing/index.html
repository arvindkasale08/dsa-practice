<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hashing Revision</title>
  <style>
    :root {
      --ink: #17231f;
      --muted: #5d6c66;
      --paper: #edf2ee;
      --panel: #fffefa;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      border-top: 4px solid var(--green);
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: var(--green);
      font-weight: 800;
      text-underline-offset: 3px;
    }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible,
    .quick-row:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      margin-bottom: 14px;
      border: 1px solid #b9c9bf;
      border-radius: 8px;
      background: var(--panel);
      padding: 5px 10px;
      color: var(--green);
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      padding: 12px;
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      color: #13241d;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
    }

    .title-row,
    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .title-row {
      gap: 10px;
    }

    .tools {
      gap: 8px;
      justify-content: flex-end;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .difficulty,
    .fact {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy { border: 1px solid #bad9ca; background: var(--green-soft); color: var(--green-dark); }
    .difficulty.medium { border: 1px solid #e6cf9b; background: var(--gold-soft); color: #74480d; }
    .difficulty.hard { border: 1px solid #e5c1bc; background: var(--red-soft); color: var(--red); }

    .fact {
      border: 1px solid var(--line);
      background: #f8faf7;
      color: var(--muted);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .subtitle {
      max-width: 840px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      overflow: hidden;
      border: 1px solid #bad9ca;
      border-top: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .card.medium {
      border-color: #e6cf9b;
      border-top-color: var(--gold);
    }

    .card.hard {
      border-color: #e5c1bc;
      border-top-color: var(--red);
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      align-items: start;
      background: #f8faf7;
      padding: 15px 16px;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .meta,
    .source {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #213c30;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .section.brute-force {
      border-color: #e6cf9b;
      background: #fffdf6;
    }

    .section.alternates {
      border-color: #bfd3e1;
      background: #f7fbff;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      border: 1px solid #bad9ca;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      padding: 0 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 900;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) minmax(180px, .85fr) minmax(220px, 1.2fr) minmax(220px, 1.2fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
      transition: box-shadow .15s ease, transform .15s ease;
    }

    .quick-row.easy { border-color: #bad9ca; border-left-color: var(--green); }
    .quick-row.medium { border-color: #e6cf9b; border-left-color: var(--gold); }
    .quick-row.hard { border-color: #e5c1bc; border-left-color: var(--red); }

    .quick-row:hover {
      box-shadow: 0 18px 38px rgba(31, 53, 42, .14);
      transform: translateY(-1px);
    }

    .quick-review,
    .quick-item,
    .quick-summary {
      display: grid;
      gap: 8px;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
    }

    .quick-title .difficulty {
      min-height: 22px;
      padding: 2px 8px;
    }

    .quick-approach {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--blue);
      background: #eef6fa;
      padding: 3px 7px;
      color: #294a5e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .quick-fact {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7faf8;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-fact b,
    .quick-uses b {
      color: #3c4d43;
      font-size: 10px;
      text-transform: uppercase;
    }

    .quick-uses {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .empty {
      display: none;
      border: 1px dashed #b9c9bf;
      border-radius: 8px;
      background: var(--panel);
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .tools { justify-content: flex-start; }
      .search { width: 100%; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,
      .section-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <div class="title-row">
          <h1>Hashing Revision</h1>
          <span id="totalCount" class="count-pill"></span>
          <div class="page-revision-controls">
            <button id="incrementAll" class="revision-button" type="button">+1 All</button>
            <button id="resetAll" class="revision-button reset" type="button">Reset All</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Search hashing cards">
        <button id="quickMode" class="mode-button active" type="button">Card Review</button>
      </div>
    </header>
    <p class="subtitle">Fast recall cards for the current hashing package. Use Quick Review first, then expand a row when you need the full explanation.</p>
    <section id="cards" class="quick-review"></section>
    <div id="empty" class="empty">No matching hashing cards.</div>
  </main>

  <script>
    const pattern = "hashing";
    const cards = [
      {
        "name": "FirstNonRepeating",
        "source": "../com/arvind/revision/hashing/FirstNonRepeating.java",
        "label": "Count first, preserve order second",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/first-unique-character-in-a-string/",
        "description": "Given a string, return the index of the first character that appears exactly once. If every character repeats, return -1.",
        "time": "O(n)",
        "space": "O(k), where k is the number of distinct characters",
        "structures": "HashMap<Character, Integer> frequency count",
        "input": "s = \"loveleetcode\"",
        "output": "2",
        "recognize": "When the answer depends on both frequency and original order: count all characters first, then scan the string again to find the earliest count-one character.",
        "visual": [
          ["l:1", "o:2", "v:1", "e:4"],
          ["scan left to right", "first count 1 = v", "index 2"]
        ],
        "visualText": "Picture the map as a frequency board, not the final answer. The second pass is what preserves the left-to-right order of the original string.",
        "core": "Build a frequency map in one pass. Scan the string again from left to right and return the first index whose character has count one. If none exists, return -1.",
        "bruteForce": "For every character, scan the whole string to see whether it appears again. This preserves order but costs O(n²).",
        "alternates": [
          "Use an int[26] array instead of a HashMap when the input is guaranteed to be lowercase English letters.",
          "Use a LinkedHashMap storing counts and first indexes, then inspect entries in insertion order; this still needs the full count information before the answer is reliable."
        ],
        "gotchas": [
          "A single pass cannot know that the current character will stay unique later.",
          "The map finds counts; the second scan finds the first index.",
          "If the character set is fixed and small, an array is simpler and faster than a HashMap."
        ]
      }
    ];

    const recallDetails = {
      "FirstNonRepeating": {
        "prompt": "Before reading: why is counting alone not enough to know the first unique character?",
        "steps": [
          "First pass records how often each character appears.",
          "Second pass walks the original string order.",
          "The first character with count one gives the answer index."
        ],
        "skeleton": "count = map\nfor c in s:\n  count[c]++\nfor i from 0 to s.length - 1:\n  if count[s[i]] == 1:\n    return i\nreturn -1"
      }
    };

    const definingMoves = {
      "FirstNonRepeating": "map answers frequency\nsecond pass answers first position"
    };

    const solvedOrder = [
      "FirstNonRepeating"
    ];

    cards.sort((a, b) => solvedOrder.indexOf(a.name) - solvedOrder.indexOf(b.name));
    cards.forEach(card => Object.assign(card, recallDetails[card.name], {
      definingMove: definingMoves[card.name]
    }));
    cards.forEach((card, index) => {
      card.problemNo = index + 1;
      card.problemLabel = `#${String(index + 1).padStart(2, "0")}`;
    });

    const cardsEl = document.getElementById("cards");
    const searchEl = document.getElementById("search");
    const emptyEl = document.getElementById("empty");
    const quickModeEl = document.getElementById("quickMode");
    const totalCountEl = document.getElementById("totalCount");
    const incrementAllEl = document.getElementById("incrementAll");
    const resetAllEl = document.getElementById("resetAll");
    let quickMode = true;
    const expandedQuickCards = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function storageKey(card) {
      return `dsa-revision:${pattern}:${card.name}`;
    }

    function readRevision(card) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(card))) || { count: 0, last: "" };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(card, data) {
      try {
        localStorage.setItem(storageKey(card), JSON.stringify(data));
      } catch {}
    }

    function today() {
      return new Date().toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function renderRevision(card) {
      const data = readRevision(card);
      return `
        <div class="revision-controls" data-revision-controls="${escapeHtml(card.name)}">
          <span class="revision-pill">Revised ${data.count || 0}x</span>
          <span class="revision-pill">Last revised: ${data.last ? escapeHtml(data.last) : "never"}</span>
          <button class="revision-button" type="button" data-action="inc" data-name="${escapeHtml(card.name)}">+1</button>
          <button class="revision-button reset" type="button" data-action="reset" data-name="${escapeHtml(card.name)}">Reset</button>
        </div>
      `;
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function renderCard(card) {
      const diff = card.difficulty.toLowerCase();
      return `
        <article class="card ${diff}" data-name="${escapeHtml(card.name)}">
          <div class="card-head">
            <div>
              <h2 class="problem-title"><span><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</span></h2>
              ${renderRevision(card)}
              <div class="meta-line">
                <span>${escapeHtml(card.label)}</span>
                <span>${escapeHtml(card.difficulty)}</span>
                <a href="${escapeHtml(card.source)}">Source</a>
                ${card.leetcode ? `<a href="${escapeHtml(card.leetcode)}" target="_blank" rel="noreferrer">LeetCode</a>` : ""}
              </div>
            </div>
            <span class="difficulty ${diff}">${escapeHtml(card.difficulty)}</span>
          </div>
          <div class="body">
            <div class="recall-prompt">${escapeHtml(card.prompt)}</div>
            <div class="description">
              <b>Problem description</b>
              ${escapeHtml(card.description)}
            </div>
            <div class="sample">
              <div class="sample-box">
                <b>Input</b>
                <code>${escapeHtml(card.input)}</code>
              </div>
              <div class="sample-box">
                <b>Output</b>
                <code>${escapeHtml(card.output)}</code>
              </div>
            </div>
            <div class="cost-strip">
              <div class="cost-item">
                <span class="cost-label">Time</span>
                <span class="cost-value">${escapeHtml(card.time)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Space</span>
                <span class="cost-value">${escapeHtml(card.space)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Data structures</span>
                <span class="cost-value">${escapeHtml(card.structures)}</span>
              </div>
            </div>
            <div class="section-grid">
              <div class="section">
                <b>When to recognize it</b>
                ${escapeHtml(card.recognize)}
              </div>
              <div class="section">
                <b>Visual hook</b>
                <div class="visual">${renderVisual(card.visual)}</div>
                ${renderSteps(card.steps)}
                <span class="hint">${escapeHtml(card.visualText)}</span>
              </div>
              <div class="section">
                <b>Core move</b>
                ${escapeHtml(card.core)}
              </div>
              <div class="section">
                <b>Code skeleton</b>
                <code>${escapeHtml(card.skeleton)}</code>
              </div>
              <div class="section brute-force">
                <b>Brute force / baseline</b>
                ${escapeHtml(card.bruteForce)}
              </div>
              <div class="section alternates">
                <b>Alternate approaches</b>
                <ul class="gotchas">${card.alternates.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
              <div class="section full">
                <b>Bug magnets</b>
                <ul class="gotchas">${card.gotchas.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderQuickRow(card) {
      const diff = card.difficulty.toLowerCase();
      const expanded = expandedQuickCards.has(card.name);
      return `
        <div class="quick-item">
          <article class="quick-row ${diff} ${expanded ? "expanded" : ""}" tabindex="0" role="button" aria-expanded="${expanded}" data-expand-card="${escapeHtml(card.name)}">
            <span class="expand-cue" aria-hidden="true">⌄</span>
            <div>
              <div class="quick-title">
                <strong><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</strong>
                <span class="difficulty ${diff}">${escapeHtml(card.difficulty)}</span>
              </div>
              ${renderRevision(card)}
              <div class="quick-summary">
                <span class="quick-approach">${escapeHtml(card.label)}</span>
                <div class="quick-facts">
                  <span class="quick-fact"><b>Time</b> ${escapeHtml(card.time)}</span>
                  <span class="quick-fact"><b>Space</b> ${escapeHtml(card.space)}</span>
                </div>
                <span class="quick-uses"><b>Uses</b> ${escapeHtml(card.structures)}</span>
              </div>
            </div>
            <div>
              <span class="quick-label">Recall prompt</span>
              <span class="quick-text">${escapeHtml(card.prompt)}</span>
            </div>
            <div>
              <span class="quick-label">Defining move</span>
              <code>${escapeHtml(card.definingMove)}</code>
            </div>
            <div>
              <span class="quick-label">Bug magnet</span>
              <span class="quick-text">${escapeHtml(card.gotchas[0])}</span>
            </div>
          </article>
          ${expanded ? renderCard(card).replace('class="card ', 'class="card quick-expanded-card ') : ""}
        </div>
      `;
    }

    function visibleCards() {
      const query = searchEl.value.trim().toLowerCase();
      return cards.filter(card => JSON.stringify(card).toLowerCase().includes(query));
    }

    function render() {
      const visible = visibleCards();
      totalCountEl.textContent = `${cards.length} problem${cards.length === 1 ? "" : "s"}`;
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = visible.map(renderQuickRow).join("");
      } else {
        cardsEl.className = "cards";
        cardsEl.innerHTML = visible.map(renderCard).join("");
      }
      emptyEl.style.display = visible.length ? "none" : "block";
    }

    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (button && button.dataset.action) {
        const card = cards.find(item => item.name === button.dataset.name);
        if (!card) return;
        if (button.dataset.action === "inc") {
          const data = readRevision(card);
          writeRevision(card, { count: (data.count || 0) + 1, last: today() });
        } else {
          writeRevision(card, { count: 0, last: "" });
        }
        render();
        return;
      }

      if (event.target.closest("a")) return;
      const row = event.target.closest(".quick-row");
      if (!row) return;
      const cardName = row.dataset.expandCard;
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    });

    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const row = event.target.closest(".quick-row");
      if (!row || event.target.closest("button, a")) return;
      event.preventDefault();
      row.click();
    });

    searchEl.addEventListener("input", render);
    quickModeEl.addEventListener("click", () => {
      quickMode = !quickMode;
      quickModeEl.classList.toggle("active", quickMode);
      render();
    });

    incrementAllEl.addEventListener("click", () => {
      const date = today();
      cards.forEach(card => {
        const data = readRevision(card);
        writeRevision(card, { count: (data.count || 0) + 1, last: date });
      });
      render();
    });

    resetAllEl.addEventListener("click", () => {
      if (!confirm("Reset revision counts for all hashing problems?")) return;
      cards.forEach(card => writeRevision(card, { count: 0, last: "" }));
      render();
    });

    render();
  </script>
</body>
</html>
