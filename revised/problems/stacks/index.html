<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacks Revision</title>
  <style>
    :root {
      --ink: #18221e;
      --muted: #5e6d66;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --paper: #edf2ee;
      --panel: #fffefa;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      border-top: 4px solid var(--green);
    }

    a {
      color: var(--green);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--green-dark); }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    .back-link:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
      color: #13241d;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .subtitle {
      margin: 0 0 18px;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .card.easy { border-color: #bad9ca; border-top-color: var(--green); }
    .card.medium { border-color: #e6cf9b; border-top-color: var(--gold); }
    .card.hard { border-color: #e5c1bc; border-top-color: var(--red); }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #f8faf7;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #bad9ca;
      color: var(--green-dark);
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #213c30;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .section.brute-force {
      border-color: #e6cf9b;
      background: #fffdf6;
    }

    .section.alternates {
      border-color: #bfd3e1;
      background: #f7fbff;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    .quick-review {
      display: grid;
      gap: 8px;
    }

    .quick-item {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) minmax(180px, .85fr) minmax(220px, 1.2fr) minmax(220px, 1.2fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
    }

    .quick-row.easy { border-color: #bad9ca; border-left-color: var(--green); }
    .quick-row.medium { border-color: #e6cf9b; border-left-color: var(--gold); }
    .quick-row.hard { border-color: #e5c1bc; border-left-color: var(--red); }

    .quick-row:hover,
    .quick-row:focus-visible,
    .quick-row.expanded {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
    }

    .quick-title .difficulty {
      min-height: 22px;
      padding: 2px 8px;
    }

    .quick-summary {
      display: grid;
      gap: 5px;
      margin-top: 6px;
    }

    .quick-approach {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--blue);
      background: #eef6fa;
      padding: 3px 7px;
      color: #294a5e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .quick-fact {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7faf8;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-fact b,
    .quick-uses b {
      color: #3c4d43;
      font-size: 10px;
      text-transform: uppercase;
    }

    .quick-uses {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-label {
      color: #3c4d43;
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .tools { justify-content: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .section.full { grid-column: auto; }
      .card-head { grid-template-columns: 1fr; }
      .tools { display: grid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <div class="title-row">
          <h1>Stacks Revision</h1>
          <span id="totalCount" class="count-pill"></span>
          <div class="page-revision-controls">
            <button id="incrementAll" class="revision-button" type="button">+1 All</button>
            <button id="resetAll" class="revision-button reset" type="button">Reset All</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Search stacks cards">
        <button id="quickMode" class="mode-button active" type="button">Card Review</button>
      </div>
    </header>
    <p class="subtitle">Fast recall cards for the current stacks package. Read the problem name, picture the hook, then check the sample and bug magnets before opening the Java file.</p>

    <section id="cards" class="cards"></section>
    <div id="empty" class="empty">No matching stacks cards.</div>
  </main>

  <script>
    const cards = [
      {
        "name": "StackUsingAnArray",
        "source": "../com/arvind/revision/stacks/StackUsingAnArray.java",
        "label": "Fixed-capacity LIFO",
        "difficulty": "Easy",
        "leetcode": "",
        "description": "Build a last-in-first-out collection backed only by a fixed-size integer array. Push adds a new top item, pop removes and returns the top item, peek reads it without removal, and invalid overflow or empty-stack operations must be rejected.",
        "time": "O(1) per operation",
        "space": "O(capacity)",
        "structures": "int[] array, top index",
        "input": "capacity = 3\npush(10), push(20), push(30)\npeek(), pop(), pop(), pop()",
        "output": "peek = 30\npops = 30, 20, 10\nisEmpty = true",
        "recognize": "When you need to implement LIFO behavior directly and the maximum number of elements is known in advance.",
        "visual": [
          [
            "top -> 30",
            "20",
            "10"
          ],
          [
            "push ↑",
            "pop ↓"
          ]
        ],
        "visualText": "Treat top as the index of the newest item. Push moves top upward before writing; pop reads the newest item and moves top downward.",
        "core": "Keep top at -1 for an empty stack. Push writes at ++top after checking space. Pop returns stack[top--] after checking that an item exists.",
        "bruteForce": "Keep the newest item at array index 0. Push shifts every existing item right; pop removes index 0 and shifts the rest left. It works, but each push and pop becomes O(n).",
        "alternates": [
          "Use a resizable array so capacity grows automatically while push and pop remain amortized O(1).",
          "Use a linked list with its head as the top when a fixed capacity is undesirable."
        ],
        "gotchas": [
          "A full stack has top == capacity - 1, so check overflow before incrementing top.",
          "Never read stack[top] when top is -1; check empty before pop and peek.",
          "This implementation is fixed capacity and does not resize."
        ]
      },
      {
        "name": "StackUsingLinkedList",
        "source": "../com/arvind/revision/stacks/StackUsingLinkedList.java",
        "label": "Head-as-top LIFO",
        "difficulty": "Easy",
        "leetcode": "",
        "description": "Build a last-in-first-out collection using a singly linked list instead of an array. The newest value must be returned first, and push, pop, peek, and empty checks should work without a preset capacity.",
        "time": "O(1) per operation",
        "space": "O(n)",
        "structures": "Singly linked list, head pointer",
        "input": "push(10), push(20), push(30)\npeek(), pop(), pop(), pop()",
        "output": "peek = 30\npops = 30, 20, 10\nisEmpty = true",
        "recognize": "When you need LIFO behavior without a fixed capacity and can use the linked-list head as the newest-item boundary.",
        "visual": [
          [
            "head/top -> 30",
            "20",
            "10",
            "null"
          ],
          [
            "new.next = head",
            "head = new"
          ]
        ],
        "visualText": "The newest node always becomes head. Push links the new node before the old head; pop simply moves head to head.next.",
        "core": "For push, point the new node to the current head and replace head. For pop, save head's value and advance head to the next node.",
        "bruteForce": "Treat the linked-list tail as the stack top. Push can append there, but pop must walk from the head to find the node before the tail, making pop O(n) in a singly linked list.",
        "alternates": [
          "Use a doubly linked list with a tail pointer so both push and pop at the tail are O(1).",
          "Use an array-backed stack when compact memory and cache-friendly access matter more than flexible growth."
        ],
        "gotchas": [
          "Do not attach the new node after head; it must become the new head/top.",
          "Check for an empty head before peek or pop.",
          "Each node adds pointer overhead, but the stack grows without a fixed array capacity."
        ]
      },
      {
        "name": "StackUsingQueues",
        "source": "../com/arvind/revision/stacks/StackUsingQueues.java",
        "label": "Rotate newest to front",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/implement-stack-using-queues/",
        "description": "Implement a last-in-first-out stack while using only normal queue operations. The most recently pushed value must be returned by top and removed by pop, even though a queue normally exposes the oldest value first.",
        "time": "Push O(n); others O(1)",

        "prompt": "Before reading: why must the current character compare only with the latest survivor?",
        "steps": [
          "Push a character when it differs from the stack top.",
          "Pop when it matches the top; the adjacent pair disappears.",
          "The next input character now sees the newly exposed survivor."
        ],
        "skeleton": "stack = empty\nfor c in s:\n  if stack not empty and stack.top == c:\n    stack.pop()\n  else:\n    stack.push(c)\nreturn characters from stack bottom to top"
      },
      "MinimumRemoveToMakeValidParanthesis": {
        "prompt": "Before reading: which invalid parentheses can be identified immediately, and which must wait until the end?",
        "steps": [
          "Scan left to right and skip any ')' with no available opener.",
          "The remaining balance counts extra '(' characters.",
          "Scan from right to left and skip that many '('."
        ],
        "skeleton": "balance = 0\nfirst = empty\nfor c in s:\n  if c == '(':\n    balance++; keep c\n  else if c == ')' and balance > 0:\n    balance--; keep c\n  else if c is letter:\n    keep c\nreverse first\nskip balance opening parentheses\nreverse result"
      },
      "DecodeString": {
        "prompt": "Before reading: what complete unit becomes available when a closing bracket appears?",
        "steps": [
          "Pop tokens until the nearest '[' to rebuild the inner text.",
          "Pop every repeat-count digit immediately before that bracket.",
          "Expand the text and push it back as one token."
        ],
        "skeleton": "stack = empty\nfor token in encoded string:\n  if token != ']':\n    stack.push(token)\n  else:\n    text = pop until '['\n    pop '['\n    count = pop adjacent digits\n    stack.push(text repeated count times)\nreturn stack joined from bottom to top"
      },
      "ValidParenthesisString": {
        "prompt": "Before reading: why must the star used as a closing parenthesis appear after the unmatched opener?",
        "steps": [
          "Store indexes of '(' and '*' in separate stacks.",
          "A ')' consumes '(' first, then '*' only if needed.",
          "Pair leftover '(' with later '*' indexes."
        ],
        "skeleton": "opens = stack of indexes\nstars = stack of indexes\nfor each index i:\n  if '(': opens.push(i)\n  else if '*': stars.push(i)\n  else if opens not empty: opens.pop()\n  else if stars not empty: stars.pop()\n  else: return false\nwhile opens not empty:\n  require stars.pop() > opens.pop()\nreturn true"
      },
      "EvaluateReversePolishNotation": {
        "prompt": "Before reading: which popped value belongs on the right side of subtraction or division?",
        "steps": [
          "Push every number token.",
          "On an operator, pop right operand first and left operand second.",
          "Compute left operator right and push the result."
        ],
        "skeleton": "values = stack\nfor token in tokens:\n  if token is number:\n    values.push(token)\n  else:\n    right = values.pop()\n    left = values.pop()\n    values.push(apply(token, left, right))\nreturn values.pop()"
      },
      "SimplifyPath": {
        "prompt": "Before reading: which path segments change the directory stack, and which disappear?",
        "steps": [
          "Ignore empty segments and '.'.",
          "'..' pops the latest retained directory when one exists.",
          "Push normal names and join them beneath '/'."
        ],
        "skeleton": "directories = stack\nfor segment in path.split('/'):\n  if segment empty or segment == '.': continue\n  if segment == '..':\n    if stack not empty: stack.pop()\n  else:\n    stack.push(segment)\nreturn '/' + join(stack, '/')"
      },
      "ExclusiveTimeOfFunctions": {
        "prompt": "Before reading: what timestamp should a paused caller resume from after an inclusive end event?",
        "steps": [
          "At a start event, pay the current top only up to the child's start.",
          "At an end event, pay the ending frame through that timestamp.",
          "Resume the caller from end + 1."
        ],
        "skeleton": "active = stack of frames\nfor log in logs:\n  event = parse(log)\n  if event is start:\n    if active not empty:\n      answer[top.id] += event.time - top.resume\n    active.push(event)\n  else:\n    frame = active.pop()\n    answer[frame.id] += event.time - frame.resume + 1\n    if active not empty:\n      top.resume = event.time + 1"
      },
      "ScoreOfParanthesis": {
        "prompt": "Before reading: why must every open parenthesis receive its own subtotal frame?",
        "steps": [
          "Push zero when a new group opens.",
          "On close, zero becomes 1; a non-zero subtotal becomes twice itself.",
          "Add the completed group score to its parent frame."
        ],
        "skeleton": "scores = stack containing 0\nfor c in s:\n  if c == '(':\n    scores.push(0)\n  else:\n    inner = scores.pop()\n    group = inner == 0 ? 1 : 2 * inner\n    parent = scores.pop()\n    scores.push(parent + group)\nreturn scores.pop()"
      },
      "MakeStringGreat": {
        "prompt": "Before reading: why is comparing the current character only with the latest survivor enough?",
        "steps": [
          "Keep surviving characters in a stack.",
          "Pop when the current character and stack top are the same letter in opposite cases.",
          "Otherwise push; the stack preserves the final order."
        ],
        "skeleton": "survivors = stack\nfor c in s:\n  if survivors not empty\n     and lower(survivors.top) == lower(c)\n     and survivors.top != c:\n    survivors.pop()\n  else:\n    survivors.push(c)\nreturn survivors from bottom to top"
      },
      "MinimumStack": {
        "prompt": "Before reading: what extra fact must each pushed value remember so getMin never scans the stack?",
        "steps": [
          "Read the previous minimum before pushing.",
          "Push a node containing the value and the new minimum-so-far.",
          "The top node answers both top and getMin; pop restores the previous snapshot."
        ],
        "skeleton": "push(value):\n  previousMin = stack empty ? value : stack.top.min\n  stack.push(Node(value, min(value, previousMin)))\npop(): stack.pop()\ntop(): return stack.top.value\ngetMin(): return stack.top.min"
      },
      "DailyTemperatures": {
        "prompt": "Before reading: why must the monotonic stack store day indexes instead of temperatures alone?",
        "steps": [
          "Keep unresolved day indexes with decreasing temperatures.",
          "A warmer current day repeatedly pops colder unresolved days.",
          "For each popped day, write current index - popped index."
        ],
        "skeleton": "unresolved = stack of indexes\nanswer = zeros\nfor day from left to right:\n  while unresolved not empty\n        and temperatures[unresolved.top] < temperatures[day]:\n    colderDay = unresolved.pop()\n    answer[colderDay] = day - colderDay\n  unresolved.push(day)\nreturn answer"
      },
      "SumOfSubarrayMinimums": {
        "prompt": "Before reading: how many subarrays choose arr[i] as their minimum, and why must duplicate boundaries be asymmetric?",
        "steps": [
          "Find previous smaller-or-equal and next strictly smaller boundaries.",
          "Multiply the number of valid start choices by valid end choices.",
          "Add value × left choices × right choices using long arithmetic."
        ],
        "skeleton": "left[i] = previous index with value <= arr[i]\nright[i] = next index with value < arr[i]\nscore = 0\nfor i:\n  leftChoices = i - left[i]\n  rightChoices = right[i] - i\n  score += (long) arr[i] * leftChoices * rightChoices\n  score %= MOD\nreturn score"
      },
      "AsteroidCollision": {
        "prompt": "Before reading: which direction pairing can actually collide, and when must the incoming asteroid keep fighting?",
        "steps": [
          "Only compare an incoming negative asteroid with a positive stack top.",
          "Pop smaller positive tops and continue with the same incoming asteroid.",
          "Push the incoming asteroid only if it survives every possible collision."
        ],
        "skeleton": "survivors = stack\nfor asteroid in asteroids:\n  incomingAlive = true\n  while incomingAlive and asteroid < 0\n        and survivors not empty and survivors.top > 0:\n    if survivors.top < abs(asteroid): survivors.pop()\n    else if survivors.top == abs(asteroid):\n      survivors.pop(); incomingAlive = false\n    else: incomingAlive = false\n  if incomingAlive: survivors.push(asteroid)\nreturn survivors in original order"
      },
      "NextGreaterElementI": {
        "prompt": "Before reading: why compute answers for all of nums2 before answering the smaller nums1 query list?",
        "steps": [
          "Scan nums2 right to left with greater candidates on a stack.",
          "Store each distinct value's next-greater answer in a map.",
          "Answer nums1 using direct map lookups."
        ],
        "skeleton": "bank = map\ncandidates = stack\nfor value in nums2 from right to left:\n  while candidates not empty and candidates.top <= value:\n    candidates.pop()\n  bank[value] = candidates empty ? -1 : candidates.top\n  candidates.push(value)\nreturn bank[value] for each value in nums1"
      },
      "NextGreaterElementIV2": {
        "prompt": "Before reading: which right-side values can be discarded forever when processing the current value?",
        "steps": [
          "Scan positions from right to left.",
          "Pop every candidate less than or equal to the current value.",
          "Write the remaining top or -1, then push the current value."
        ],
        "skeleton": "candidates = stack\nanswer = array\nfor i from last to first:\n  while candidates not empty and candidates.top <= arr[i]:\n    candidates.pop()\n  answer[i] = candidates empty ? -1 : candidates.top\n  candidates.push(arr[i])\nreturn answer"
      },
      "NextGreaterElementII": {
        "prompt": "Before reading: how can a circular right-side search become the same linear next-greater scan you already know?",
        "steps": [
          "Unroll one circular lap by viewing the array twice.",
          "Run the normal right-to-left decreasing-stack scan over the doubled view.",
          "Keep only the first copy's answers."
        ],
        "skeleton": "doubled = nums + nums\ncandidates = stack\nnext = array for doubled\nfor i from doubled.length - 1 to 0:\n  while candidates not empty and candidates.top <= doubled[i]:\n    candidates.pop()\n  next[i] = candidates empty ? -1 : candidates.top\n  candidates.push(doubled[i])\nreturn next[0..n-1]"
      },
      "StockSpanner": {
        "prompt": "Before reading: why can one popped node contribute several days to today's span?",
        "steps": [
          "Begin today's span at one.",
          "Pop every price less than or equal to today and inherit its compressed span.",
          "Push today's price with the combined span for future calls."
        ],
        "skeleton": "next(price):\n  span = 1\n  while stack not empty and stack.top.price <= price:\n    span += stack.pop().span\n  stack.push(Node(price, span))\n  return span"
      },
      "MaximumWidthRamp": {
        "prompt": "Before reading: why are only strict record-low indexes useful as possible ramp starts?",
        "steps": [
          "Keep indexes of strict new lows while scanning left to right.",
          "Scan possible end indexes from the far right toward the left.",
          "Pop every start that the current end can satisfy; this is its widest match."
        ],
        "skeleton": "starts = stack of strict record-low indexes\nfor i from left to right:\n  if nums[i] < nums[starts.top]: starts.push(i)\nmaxWidth = 0\nfor j from right to left:\n  while starts not empty and nums[starts.top] <= nums[j]:\n    maxWidth = max(maxWidth, j - starts.pop())\nreturn maxWidth"
      },
      "SortingStack": {
        "prompt": "Before reading: how do you insert the current value into the helper stack without random access?",
        "steps": [
          "Pop the current value from the input stack.",
          "Move helper-stack values back to input while they block the current value.",
          "Push the current value into helper, then let moved values get processed again."
        ],
        "skeleton": "helper = empty stack\nwhile input not empty:\n  curr = input.pop()\n  while helper not empty and helper.top > curr:\n    input.push(helper.pop())\n  helper.push(curr)\nreturn helper"
      },
      "RemoveDuplicateLetters": {
        "prompt": "Before reading: when is it safe to remove a larger letter already in the answer stack?",
        "steps": [
          "Know the last index where every letter appears.",
          "Skip letters already used in the answer stack.",
          "Pop larger stack-top letters only if they appear again later."
        ],
        "skeleton": "last = last index for each letter\nseen = false for each letter\nstack = empty\nfor i, c in s:\n  if seen[c]: continue\n  while stack not empty\n        and stack.top > c\n        and i < last[stack.top]:\n    seen[stack.pop()] = false\n  stack.push(c)\n  seen[c] = true\nreturn stack as string"
      },
      "RemoveAllAdjacentDuplicatesII": {
        "prompt": "Before reading: what should happen when the current character makes the top run length exactly k?",
        "steps": [
          "Track each survivor character with the length of its current adjacent run.",
          "If current matches the top and would reach k, remove the stored run and skip current.",
          "Otherwise push current with count one or top count plus one."
        ],
        "skeleton": "stack = characters with counts\nfor c in s:\n  if stack top has same c:\n    if stack.top.count + 1 == k:\n      pop k - 1 previous copies\n      skip current c\n    else:\n      push Node(c, stack.top.count + 1)\n  else:\n    push Node(c, 1)\nreturn stack characters from bottom to top"
      },
      "RemoveNodesFromLinkedList": {
        "prompt": "Before reading: what should happen to earlier stack nodes when a larger current node arrives?",
        "steps": [
          "Keep survivor nodes in decreasing value order.",
          "Pop every smaller survivor when a larger current node appears.",
          "Reconnect the new survivor tail to current, or move head when none remain."
        ],
        "skeleton": "survivors = stack of nodes\npush head\nfor current in remaining nodes:\n  while survivors not empty and survivors.top.val < current.val:\n    survivors.pop()\n  if survivors empty:\n    head = current\n  else:\n    survivors.top.next = current\n  survivors.push(current)\nreturn head"
      },
      "DecimalToBinary": {
        "prompt": "Before reading: why does the first remainder become the last character of the binary answer?",
        "steps": [
          "Take num % 2 to get the least significant bit.",
          "Divide num by 2 to move left through the binary places.",
          "Reverse the collected remainders before returning."
        ],
        "skeleton": "bits = empty builder\nwhile num > 0:\n  bits.append(num % 2)\n  num = num / 2\nreturn reverse(bits)"
      }
    };

    const definingMoves = {
      "StackUsingAnArray": "push: stack[++top] = x\npop: return stack[top--]",
      "StackUsingLinkedList": "node.next = head\nhead = node",
      "StackUsingQueues": "after offer(x), rotate size - 1 items",
      "ValidParanthesis": "closer must match stack.top\nthen pop",
      "ReverseUsingStacks": "push every character\npop into output order",
      "RemoveAllAdjacentDuplicates": "current == stack.top ? pop : push",
      "MinimumRemoveToMakeValidParanthesis": "skip unmatched ')' now\nremove leftover '(' from the right",
      "DecodeString": "on ']': pop text + count\npush repeated text",
      "ValidParenthesisString": "pair leftover '(' only with a later '*'",
      "EvaluateReversePolishNotation": "right = pop(); left = pop()\npush(left operator right)",
      "SimplifyPath": "'..' → pop latest directory\nnormal name → push",
      "ExclusiveTimeOfFunctions": "end pays +1 inclusive\ncaller resumes at end + 1",
      "ScoreOfParanthesis": "group = inner == 0 ? 1 : 2 × inner\nparent += group",
      "MakeStringGreat": "same letter + opposite case?\npop : push",
      "MinimumStack": "push Node(value, min(value, previousMin))",
      "DailyTemperatures": "while current > temperature[stack.top]:\nanswer[pop] = currentDay - colderDay",
      "SumOfSubarrayMinimums": "contribution = value × leftChoices × rightChoices\none boundary owns equals",
      "AsteroidCollision": "only stack.top > 0 and incoming < 0 collide\nsmaller top? pop and keep fighting",
      "NextGreaterElementI": "precompute nums2 value → next greater\nthen map each nums1 query",
      "NextGreaterElementIV2": "pop while stack.top <= current\nanswer = stack.top or -1",

      "StockSpanner": "while top.price <= price:\nspan += pop().span",
      "MaximumWidthRamp": "stack = strict record-low start indexes\nscan end indexes from far right",
      "SortingStack": "move larger helper values back\nthen push current into helper",
      "RemoveDuplicateLetters": "pop larger top only if it appears later\nthen push current once",
      "RemoveAllAdjacentDuplicatesII": "same char and count + 1 == k?\npop previous k - 1 and skip current",
      "RemoveNodesFromLinkedList": "current larger? pop smaller survivors\nthen relink top.next = current",

    const solvedOrder = [

    cards.sort((a, b) => solvedOrder.indexOf(a.name) - solvedOrder.indexOf(b.name));

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function storageKey(cardName) {
      return `dsa-revision:stacks:${cardName}`;
    }

    function readRevision(cardName) {
      try {
        const raw = localStorage.getItem(storageKey(cardName));
        if (!raw) return { count: 0, last: "" };
        const parsed = JSON.parse(raw);
        return {
          count: Number(parsed.count) || 0,
          last: typeof parsed.last === "string" ? parsed.last : ""
        };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(cardName, revision) {
      try {
        localStorage.setItem(storageKey(cardName), JSON.stringify(revision));
      } catch {
        // Keep the page usable even if browser storage is unavailable.
      }
    }

    function formatLastRevised(value) {
      if (!value) return "Last revised: never";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return `Last revised: ${value}`;
      return `Last revised: ${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
    }

    function todayLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderRevisionControls(card) {
      const revision = readRevision(card.name);
      return `
        <div class="revision-controls">
          <span class="revision-pill">Revised ${revision.count}x</span>
          <span class="revision-pill">${escapeHtml(formatLastRevised(revision.last))}</span>
          <button class="revision-button" type="button" data-action="increment" data-card="${escapeHtml(card.name)}">+1</button>
          <button class="revision-button reset" type="button" data-action="reset" data-card="${escapeHtml(card.name)}">Reset</button>
        </div>
      `;
    }

    }

    function toggleQuickCard(cardName) {
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.problemLabel,
          card.label,
          card.difficulty,
          card.time,
          card.space,
          card.structures,
          card.leetcode,
          card.source,
          card.description,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.prompt,
          card.skeleton,
          card.steps.join(" "),
          card.gotchas.join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = renderQuickReview(visible);
        emptyEl.style.display = visible.length ? "none" : "block";
        return;
      }

      cardsEl.className = "cards";
      cardsEl.innerHTML = visible.map(card => renderFullCard(card)).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action][data-card]");
      if (button) {
        const cardName = button.dataset.card;
        if (button.dataset.action === "increment") {
          const current = readRevision(cardName);
          writeRevision(cardName, {
            count: current.count + 1,
            last: todayLocalDate()
          });
        }
        if (button.dataset.action === "reset") {
          writeRevision(cardName, { count: 0, last: "" });
        }
        render();
        return;
      }
      const quickRow = event.target.closest("[data-expand-card]");
      if (quickRow) toggleQuickCard(quickRow.dataset.expandCard);
    });
    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const quickRow = event.target.closest("[data-expand-card]");
      if (!quickRow || event.target.closest("button, a")) return;
      event.preventDefault();
      toggleQuickCard(quickRow.dataset.expandCard);
    });
    incrementAllEl.addEventListener("click", () => {
      const today = todayLocalDate();
      cards.forEach(card => {
        const current = readRevision(card.name);
        writeRevision(card.name, {
          count: current.count + 1,
          last: today
        });
      });
      render();
    });
    resetAllEl.addEventListener("click", () => {
      if (!window.confirm("Reset revision counts and dates for all stacks problems?")) return;
      cards.forEach(card => writeRevision(card.name, { count: 0, last: "" }));
      render();
    });
    quickModeEl.addEventListener("click", () => {
      quickMode = !quickMode;
      quickModeEl.classList.toggle("active", quickMode);
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
      render();
    });
    totalCountEl.textContent = `${cards.length} problems`;
    render();
  </script>
</body>
</html>
