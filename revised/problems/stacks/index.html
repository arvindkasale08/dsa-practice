<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacks Revision</title>
  <style>
    :root {
      --ink: #18221e;
      --muted: #5e6d66;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --paper: #edf2ee;
      --panel: #fffefa;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      border-top: 4px solid var(--green);
    }

    a {
      color: var(--green);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--green-dark); }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    .back-link:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
      color: #13241d;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .subtitle {
      margin: 0 0 18px;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .cards > .card:nth-child(4n + 2) { border-top-color: var(--blue); }
    .cards > .card:nth-child(4n + 3) { border-top-color: var(--gold); }
    .cards > .card:nth-child(4n + 4) { border-top-color: var(--red); }

    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #f8faf7;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #bad9ca;
      color: var(--green-dark);
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #213c30;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    .quick-review {
      display: grid;
      gap: 8px;
    }

    .quick-item {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(160px, .9fr) minmax(130px, .7fr) minmax(220px, 1.4fr) minmax(220px, 1.4fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
    }

    .quick-item:nth-child(4n + 2) .quick-row { border-left-color: var(--blue); }
    .quick-item:nth-child(4n + 3) .quick-row { border-left-color: var(--gold); }
    .quick-item:nth-child(4n + 4) .quick-row { border-left-color: var(--red); }

    .quick-row:hover,
    .quick-row:focus-visible,
    .quick-row.expanded {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .quick-label {
      color: #3c4d43;
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .tools { justify-content: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .section.full { grid-column: auto; }
      .card-head { grid-template-columns: 1fr; }
      .tools { display: grid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <div class="title-row">
          <h1>Stacks Revision</h1>
          <span id="totalCount" class="count-pill"></span>
          <div class="page-revision-controls">
            <button id="incrementAll" class="revision-button" type="button">+1 All</button>
            <button id="resetAll" class="revision-button reset" type="button">Reset All</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Search stacks cards">
        <button id="quickMode" class="mode-button" type="button">Quick Review</button>
      </div>
    </header>
    <p class="subtitle">Fast recall cards for the current stacks package. Read the problem name, picture the hook, then check the sample and bug magnets before opening the Java file.</p>

    <section id="cards" class="cards"></section>
    <div id="empty" class="empty">No matching stacks cards.</div>
  </main>

  <script>
    const cards = [
      {
        "name": "StackUsingAnArray",
        "source": "../com/arvind/revision/stacks/StackUsingAnArray.java",
        "label": "Fixed-capacity LIFO",
        "difficulty": "Easy",
        "leetcode": "",
        "description": "Implement a stack using a fixed-size integer array. Support push, pop, peek, and empty checks while rejecting overflow and underflow.",
        "time": "O(1) per operation",
        "space": "O(capacity)",
        "structures": "int[] array, top index",
        "input": "capacity = 3\npush(10), push(20), push(30)\npeek(), pop(), pop(), pop()",
        "output": "peek = 30\npops = 30, 20, 10\nisEmpty = true",
        "recognize": "When you need to implement LIFO behavior directly and the maximum number of elements is known in advance.",
        "visual": [
          [
            "top -> 30",
            "20",
            "10"
          ],
          [
            "push ↑",
            "pop ↓"
          ]
        ],
        "visualText": "Treat top as the index of the newest item. Push moves top upward before writing; pop reads the newest item and moves top downward.",
        "core": "Keep top at -1 for an empty stack. Push writes at ++top after checking space. Pop returns stack[top--] after checking that an item exists.",
        "gotchas": [
          "A full stack has top == capacity - 1, so check overflow before incrementing top.",
          "Never read stack[top] when top is -1; check empty before pop and peek.",
          "This implementation is fixed capacity and does not resize."
        ]
      },
      {
        "name": "StackUsingLinkedList",
        "source": "../com/arvind/revision/stacks/StackUsingLinkedList.java",
        "label": "Head-as-top LIFO",
        "difficulty": "Easy",
        "leetcode": "",
        "description": "Implement a stack using a singly linked list. The head node acts as the stack top, allowing push, pop, peek, and empty checks without a fixed capacity.",
        "time": "O(1) per operation",
        "space": "O(n)",
        "structures": "Singly linked list, head pointer",
        "input": "push(10), push(20), push(30)\npeek(), pop(), pop(), pop()",
        "output": "peek = 30\npops = 30, 20, 10\nisEmpty = true",
        "recognize": "When you need LIFO behavior without a fixed capacity and can use the linked-list head as the newest-item boundary.",
        "visual": [
          [
            "head/top -> 30",
            "20",
            "10",
            "null"
          ],
          [
            "new.next = head",
            "head = new"
          ]
        ],
        "visualText": "The newest node always becomes head. Push links the new node before the old head; pop simply moves head to head.next.",
        "core": "For push, point the new node to the current head and replace head. For pop, save head's value and advance head to the next node.",
        "gotchas": [
          "Do not attach the new node after head; it must become the new head/top.",
          "Check for an empty head before peek or pop.",
          "Each node adds pointer overhead, but the stack grows without a fixed array capacity."
        ]
      },
      {
        "name": "StackUsingQueues",
        "source": "../com/arvind/revision/stacks/StackUsingQueues.java",
        "label": "Rotate newest to front",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/implement-stack-using-queues/",
        "description": "Implement stack behavior using a single queue. After each push, rotate older items behind the new value so the queue front always acts as the stack top.",
        "time": "Push O(n); others O(1)",
        "space": "O(n)",
        "structures": "Single queue",
        "input": "push(10), push(20), push(30)\npeek(), pop(), pop(), pop()",
        "output": "peek = 30\npops = 30, 20, 10\nisEmpty = true",
        "recognize": "When you must build LIFO behavior using only FIFO queue operations and can pay extra work during push.",
        "visual": [
          [
            "offer 30",
            "10",
            "20"
          ],
          [
            "rotate old items",
            "30",
            "20",
            "10"
          ]
        ],
        "visualText": "Push places the new value at the back, then rotates every older value behind it. The newest value finishes at the queue front.",
        "core": "Offer the new value, then move exactly the previous queue-size elements from front to back. After rotation, poll and peek behave like stack pop and top.",
        "gotchas": [
          "Rotate queue.size() - 1 items, not the full size; one extra rotation restores FIFO order.",
          "Check empty before poll or peek to avoid null-to-int unboxing errors.",
          "This design makes push O(n) so pop and peek can stay O(1)."
        ]
      }
    ];

    const recallDetails = {
      "StackUsingAnArray": {
        "prompt": "Before reading: what does top represent when the stack is empty, full, and holding items?",
        "steps": [
          "Empty means top = -1.",
          "Push checks space, increments top, then writes.",
          "Pop reads top, then decrements it."
        ],
        "skeleton": "top = -1\npush(x):\n  if top >= capacity - 1: overflow\n  stack[++top] = x\npop():\n  if top == -1: underflow\n  return stack[top--]"
      },
      "StackUsingLinkedList": {
        "prompt": "Before reading: why must every new node become the head?",
        "steps": [
          "Create a node for the new value.",
          "Point new.next to the current head.",
          "Move head to new; pop reverses that boundary move."
        ],
        "skeleton": "head = null\npush(x):\n  node = new Node(x)\n  node.next = head\n  head = node\npop():\n  if head == null: underflow\n  value = head.val\n  head = head.next\n  return value"
      },
      "StackUsingQueues": {
        "prompt": "Before reading: how many queue elements must rotate after adding the new top?",
        "steps": [
          "Offer the new value at the queue back.",
          "Rotate exactly the older elements from front to back.",
          "The new value reaches the front, so poll now behaves like pop."
        ],
        "skeleton": "push(x):\n  queue.offer(x)\n  repeat queue.size() - 1 times:\n    queue.offer(queue.poll())\npop():\n  if queue empty: underflow\n  return queue.poll()"
      }
    };

    cards.forEach(card => Object.assign(card, recallDetails[card.name]));
    cards.forEach((card, index) => {
      card.problemNo = index + 1;
      card.problemLabel = `#${String(index + 1).padStart(2, "0")}`;
    });

    const cardsEl = document.getElementById("cards");
    const searchEl = document.getElementById("search");
    const emptyEl = document.getElementById("empty");
    const quickModeEl = document.getElementById("quickMode");
    const totalCountEl = document.getElementById("totalCount");
    const incrementAllEl = document.getElementById("incrementAll");
    const resetAllEl = document.getElementById("resetAll");
    let quickMode = false;
    const expandedQuickCards = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function storageKey(cardName) {
      return `dsa-revision:stacks:${cardName}`;
    }

    function readRevision(cardName) {
      try {
        const raw = localStorage.getItem(storageKey(cardName));
        if (!raw) return { count: 0, last: "" };
        const parsed = JSON.parse(raw);
        return {
          count: Number(parsed.count) || 0,
          last: typeof parsed.last === "string" ? parsed.last : ""
        };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(cardName, revision) {
      try {
        localStorage.setItem(storageKey(cardName), JSON.stringify(revision));
      } catch {
        // Keep the page usable even if browser storage is unavailable.
      }
    }

    function formatLastRevised(value) {
      if (!value) return "Last revised: never";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return `Last revised: ${value}`;
      return `Last revised: ${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
    }

    function todayLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderRevisionControls(card) {
      const revision = readRevision(card.name);
      return `
        <div class="revision-controls">
          <span class="revision-pill">Revised ${revision.count}x</span>
          <span class="revision-pill">${escapeHtml(formatLastRevised(revision.last))}</span>
          <button class="revision-button" type="button" data-action="increment" data-card="${escapeHtml(card.name)}">+1</button>
          <button class="revision-button reset" type="button" data-action="reset" data-card="${escapeHtml(card.name)}">Reset</button>
        </div>
      `;
    }

    function renderFullCard(card, extraClass = "") {
      return `
        <article class="card ${extraClass}">
          <div class="card-head">
            <div>
              <h2 class="problem-title"><span><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</span></h2>
              ${renderRevisionControls(card)}
              <div class="meta-line">
                <span>${escapeHtml(card.label)}</span>
                <span>${escapeHtml(card.difficulty)}</span>
                <a href="${escapeHtml(card.source)}">Source</a>
                ${card.leetcode ? `<a href="${escapeHtml(card.leetcode)}" target="_blank" rel="noreferrer">LeetCode</a>` : ""}
              </div>
            </div>
            <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
          </div>
          <div class="body">
            <div class="recall-prompt">${escapeHtml(card.prompt)}</div>
            <div class="description">
              <b>Problem description</b>
              ${escapeHtml(card.description)}
            </div>
            <div class="cost-strip">
              <div class="cost-item">
                <span class="cost-label">Time</span>
                <span class="cost-value">${escapeHtml(card.time)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Space</span>
                <span class="cost-value">${escapeHtml(card.space)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Data structures</span>
                <span class="cost-value">${escapeHtml(card.structures)}</span>
              </div>
            </div>
            <div class="sample">
              <div class="sample-box">
                <b>Input</b>
                <code>${escapeHtml(card.input)}</code>
              </div>
              <div class="sample-box">
                <b>Output</b>
                <code>${escapeHtml(card.output)}</code>
              </div>
            </div>
            <div class="section-grid">
              <div class="section">
                <b>When to recognize it</b>
                ${escapeHtml(card.recognize)}
              </div>
              <div class="section">
                <b>Visual hook</b>
                <div class="visual">${renderVisual(card.visual)}</div>
                ${renderSteps(card.steps)}
                <span class="hint">${escapeHtml(card.visualText)}</span>
              </div>
              <div class="section">
                <b>Core move</b>
                ${escapeHtml(card.core)}
              </div>
              <div class="section">
                <b>Code skeleton</b>
                <code>${escapeHtml(card.skeleton)}</code>
              </div>
              <div class="section full">
                <b>Bug magnets</b>
                <ul class="gotchas">${card.gotchas.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderQuickReview(cardsToRender) {
      return `<div class="quick-review">${cardsToRender.map(card => {
        const expanded = expandedQuickCards.has(card.name);
        return `
          <div class="quick-item">
            <article class="quick-row ${expanded ? "expanded" : ""}" data-expand-card="${escapeHtml(card.name)}" role="button" tabindex="0" aria-expanded="${expanded}">
              <span class="expand-cue" aria-hidden="true">⌄</span>
              <div>
                <strong><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</strong>
                ${renderRevisionControls(card)}
                <span class="quick-text">${escapeHtml(card.difficulty)} · ${escapeHtml(card.label)}</span>
                <span class="quick-text">${escapeHtml(card.time)} time · ${escapeHtml(card.space)} space</span>
                <span class="quick-text">Uses: ${escapeHtml(card.structures)}</span>
              </div>
              <div>
                <span class="quick-label">Recall prompt</span>
                <span class="quick-text">${escapeHtml(card.prompt)}</span>
              </div>
              <div>
                <span class="quick-label">Code shape</span>
                <code>${escapeHtml(card.skeleton.split("\n")[0])}</code>
              </div>
              <div>
                <span class="quick-label">Bug magnet</span>
                <span class="quick-text">${escapeHtml(card.gotchas[0])}</span>
              </div>
            </article>
            ${expanded ? renderFullCard(card, "quick-expanded-card") : ""}
          </div>
        `;
      }).join("")}</div>`;
    }

    function toggleQuickCard(cardName) {
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.problemLabel,
          card.label,
          card.difficulty,
          card.time,
          card.space,
          card.structures,
          card.leetcode,
          card.source,
          card.description,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.prompt,
          card.skeleton,
          card.steps.join(" "),
          card.gotchas.join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = renderQuickReview(visible);
        emptyEl.style.display = visible.length ? "none" : "block";
        return;
      }

      cardsEl.className = "cards";
      cardsEl.innerHTML = visible.map(card => renderFullCard(card)).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action][data-card]");
      if (button) {
        const cardName = button.dataset.card;
        if (button.dataset.action === "increment") {
          const current = readRevision(cardName);
          writeRevision(cardName, {
            count: current.count + 1,
            last: todayLocalDate()
          });
        }
        if (button.dataset.action === "reset") {
          writeRevision(cardName, { count: 0, last: "" });
        }
        render();
        return;
      }
      const quickRow = event.target.closest("[data-expand-card]");
      if (quickRow) toggleQuickCard(quickRow.dataset.expandCard);
    });
    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const quickRow = event.target.closest("[data-expand-card]");
      if (!quickRow || event.target.closest("button, a")) return;
      event.preventDefault();
      toggleQuickCard(quickRow.dataset.expandCard);
    });
    incrementAllEl.addEventListener("click", () => {
      const today = todayLocalDate();
      cards.forEach(card => {
        const current = readRevision(card.name);
        writeRevision(card.name, {
          count: current.count + 1,
          last: today
        });
      });
      render();
    });
    resetAllEl.addEventListener("click", () => {
      if (!window.confirm("Reset revision counts and dates for all stacks problems?")) return;
      cards.forEach(card => writeRevision(card.name, { count: 0, last: "" }));
      render();
    });
    quickModeEl.addEventListener("click", () => {
      quickMode = !quickMode;
      quickModeEl.classList.toggle("active", quickMode);
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
      render();
    });
    totalCountEl.textContent = `${cards.length} problems`;
    render();
  </script>
</body>
</html>
