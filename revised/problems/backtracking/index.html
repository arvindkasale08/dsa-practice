<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backtracking Revision</title>
  <style>
    :root {
      --ink: #18221e;
      --muted: #5e6d66;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --paper: #edf2ee;
      --panel: #fffefa;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      border-top: 4px solid var(--green);
    }

    a {
      color: var(--green);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--green-dark); }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    .back-link:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
      color: #13241d;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .subtitle {
      margin: 0 0 18px;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .pdf-button {
      height: 42px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--panel);
      color: var(--blue);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .pdf-button:hover {
      background: rgba(50, 108, 148, .12);
      transform: translateY(-1px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .card.easy { border-color: #bad9ca; border-top-color: var(--green); }
    .card.medium { border-color: #e6cf9b; border-top-color: var(--gold); }
    .card.hard { border-color: #e5c1bc; border-top-color: var(--red); }

    .card.theory {
      background: #efe7ff;
      border-color: #8f70d7;
      border-top-color: #4f2f9f;
      box-shadow: 0 14px 30px rgba(79, 47, 159, .18);
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #f8faf7;
    }

    .card.theory .card-head,
    .card.theory .body {
      background: #f4eeff;
    }

    .card.theory .card-head {
      border-bottom-color: #b79ee8;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .card.theory .problem-no,
    .quick-row.theory .problem-no,
    .quick-row.theory .expand-cue {
      color: #3f1f8f;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #bad9ca;
      color: var(--green-dark);
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #213c30;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .section.brute-force {
      border-color: #e6cf9b;
      background: #fffdf6;
    }

    .section.alternates {
      border-color: #bfd3e1;
      background: #f7fbff;
    }

    .section.variant-lens {
      border-color: #e6cf9b;
      border-left: 4px solid var(--gold);
      background: #fff8e8;
      color: #60430d;
      font-weight: 700;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    .quick-review {
      display: grid;
      gap: 8px;
    }

    .quick-item {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) minmax(180px, .85fr) minmax(220px, 1.2fr) minmax(220px, 1.2fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
    }

    .quick-row.easy { border-color: #bad9ca; border-left-color: var(--green); }
    .quick-row.medium { border-color: #e6cf9b; border-left-color: var(--gold); }
    .quick-row.hard { border-color: #e5c1bc; border-left-color: var(--red); }

    .quick-row.theory {
      background: #efe7ff;
      border-color: #8f70d7;
      border-left-color: #4f2f9f;
      box-shadow: 0 8px 18px rgba(79, 47, 159, .18);
    }

    .quick-row:hover,
    .quick-row:focus-visible,
    .quick-row.expanded {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .quick-row.theory:hover,
    .quick-row.theory:focus-visible,
    .quick-row.theory.expanded {
      background: #e6dcff;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
    }

    .quick-title .difficulty {
      min-height: 22px;
      padding: 2px 8px;
    }

    .quick-summary {
      display: grid;
      gap: 5px;
      margin-top: 6px;
    }

    .quick-approach {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--blue);
      background: #eef6fa;
      padding: 3px 7px;
      color: #294a5e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .quick-variant {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--gold);
      background: #fff5dc;
      padding: 3px 7px;
      color: #76510d;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .quick-fact {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7faf8;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-fact b,
    .quick-uses b {
      color: #3c4d43;
      font-size: 10px;
      text-transform: uppercase;
    }

    .quick-uses {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-label {
      color: #3c4d43;
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .tools { justify-content: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .section.full { grid-column: auto; }
      .card-head { grid-template-columns: 1fr; }
      .tools { display: grid; }
    }

    @media print {
      @page {
        margin: 12mm;
      }

      body {
        background: white;
      }

      .page {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .back-link,
      .tools,
      .page-revision-controls,
      .revision-controls,
      .source-link {
        display: none !important;
      }

      header {
        position: static;
        display: block;
        padding: 0 0 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid #cfd8d3;
        box-shadow: none;
      }

      .subtitle {
        margin-bottom: 12px;
      }

      .cards {
        display: block;
      }

      .card {
        break-inside: auto;
        page-break-inside: auto;
        margin-bottom: 10px;
        box-shadow: none;
        overflow: visible;
      }

      .card-head,
      .recall-prompt,
      .description,
      .sample-box,
      .cost-item,
      .section {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .body {
        padding: 10px;
      }

      .sample,
      .cost-strip,
      .section-grid {
        gap: 8px;
      }

      .card:hover,
      .quick-row:hover {
        transform: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <div class="title-row">
          <h1>Backtracking Revision</h1>
          <span id="totalCount" class="count-pill"></span>
          <div class="page-revision-controls">
            <button id="incrementAll" class="revision-button" type="button">+1 All</button>
            <button id="resetAll" class="revision-button reset" type="button">Reset All</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Search backtracking cards">
        <button id="quickMode" class="mode-button active" type="button">Card Review</button>
        <button id="exportPdf" class="pdf-button" type="button">Export PDF</button>
      </div>
    </header>
    <p class="subtitle">Fast recall cards for the current backtracking package. Picture the choice, the smaller recursive call, and the undo step before opening the Java file.</p>

    <section id="cards" class="cards"></section>
    <div id="empty" class="empty">No matching backtracking cards.</div>
  </main>

  <script>
    const cards = [
      {
            "name": "SubsequencePatternsTheory",
            "source": "https://takeuforward.org/data-structure/learn-all-patterns-of-subsequences-theory",
            "label": "Pick or skip every item",
            "difficulty": "Easy",
            "leetcode": "",
            "description": "A subsequence is made by deleting zero or more elements while keeping the remaining order. Elements do not need to be adjacent. Most subsequence problems start from the same decision: for each item, either pick it into the current path or skip it.",
            "time": "O(2^n * n) to generate",
            "space": "O(n) call stack + output",
            "timeWhy": "Every item has two choices: pick or skip. That creates 2^n branches. If you copy or print each completed subsequence, each output can cost up to n more work.",
            "structures": "index, path/list, recursion stack",

                  "Transition B: pick arr[idx], add it to currSum, and move to idx + 1.",
                  "Post step: sort result if the statement asks for increasing order."
            ],
            "skeleton": "dfs(idx, currSum):\n  Base: if idx == n\n    result.add(currSum)\n    return\n\n  State: idx, currSum\n\n  Transition A: skip current\n    dfs(idx + 1, currSum)\n\n  Transition B: pick current\n    dfs(idx + 1, currSum + arr[idx])\n\n  final answer:\n    sort(result) when increasing order is required"
      },
      "SubsetII": {
            "prompt": "Before reading: why is the current path saved before the loop, and which duplicate is skipped?",
            "steps": [
                  "Base/save condition: every current path is a valid subset, so save it at the start of the call.",
                  "State carried: sorted nums, start idx, and current path.",
                  "Allowed transition: choose nums[i], recurse from i + 1, then undo.",
                  "Blocked transition: if i > idx and nums[i] equals nums[i - 1], skip that duplicate sibling."
            ],
            "skeleton": "dfs(idx, path):\n  Save: add copy(path) immediately\n\n  State: sorted nums, idx, path\n\n  for i from idx to n - 1:\n    Block duplicate sibling:\n      if i > idx AND nums[i] == nums[i - 1]\n        continue\n\n    Transition: pick nums[i]\n      path.add(nums[i])\n      dfs(i + 1, path)\n      undo remove last"
      },
      "PalindromePartitioning": {
            "prompt": "Before reading: from this start index, which cuts are allowed to become branches?",
            "steps": [
                  "Base/save condition: idx == s.length() means every character has been partitioned, so copy the path.",
                  "State carried: current start idx and the list of palindrome pieces already chosen.",
                  "Allowed transition: choose substring s[idx..end] only when it is palindrome.",
                  "Blocked transition: skip any substring that is not palindrome.",
                  "Undo step: remove the chosen substring after returning from recursion."
            ],
            "skeleton": "dfs(idx, path):\n  Base: if idx == s.length\n    add copy(path); return\n\n  State: idx, path of chosen palindrome pieces\n\n  for end from idx to n - 1:\n    piece = s[idx..end]\n    Block: if piece is not palindrome -> continue\n\n    Transition: cut this piece\n      path.add(piece)\n      dfs(end + 1, path)\n      undo remove last"
      },
      "WordSearch": {
            "prompt": "Before reading: after matching this cell, what exact state must be marked and later undone?",
            "steps": [
                  "Base/success condition: current index is the last word character and it matched.",
                  "State carried: row, col, word index, and visited matrix.",
                  "Allowed transitions: try the four neighbors only if they are in bounds, unvisited, and match word[index + 1].",
                  "Blocked transitions: wrong character, already visited, or outside the grid.",
                  "Undo step: unmark the neighbor when that branch does not find the word."
            ],
            "skeleton": "exist(board, word):\n  for each cell:\n    if cell matches word[0]\n      mark visited\n      if dfs(row, col, 0) -> true\n      undo visited\n  return false\n\ndfs(row, col, idx):\n  Base: if idx == word.length - 1 -> true\n\n  State: row, col, idx, visited\n\n  for each direction:\n    next = neighbor cell\n    Block: out of bounds OR visited OR board[next] != word[idx + 1]\n\n    Transition: mark next\n      if dfs(nextRow, nextCol, idx + 1) -> true\n      undo next"
      },
      "NQueens": {
            "prompt": "Before reading: why do we only check the rows above the current row?",
            "steps": [
                  "Base/save condition: row == n means all queens were placed safely, so copy the board.",
                  "State carried: current row and the mutable board.",
                  "Allowed transition: try each column in the current row and place Q only if safe.",
                  "Blocked transition: same column, upper-left diagonal, or upper-right diagonal already has a queen.",
                  "Undo step: set board[row][col] back to '.' after returning from recursion."
            ],
            "skeleton": "dfs(row):\n  Base: if row == n\n    add copy(board); return\n\n  State: row, board\n\n  for col from 0 to n - 1:\n    Block: if not safe(row, col) -> continue\n\n    Transition: place queen\n      board[row][col] = 'Q'\n      dfs(row + 1)\n      undo board[row][col] = '.'\n\nsafe(row, col):\n  check north column\n  check north-west diagonal\n  check north-east diagonal"
      },
      "RatMaze": {
            "prompt": "Before reading: what state prevents the path from walking in circles?",
            "steps": [
                  "Base/save condition: current cell is bottom-right, so add the built path string.",
                  "State carried: row, col, path string, visited matrix, and grid.",
                  "Allowed transitions: try U, R, D, and L only when the next cell is open and unvisited.",
                  "Blocked transition: outside grid, blocked cell, or visited cell.",
                  "Undo step: unmark the current cell after all four directions finish."
            ],
            "skeleton": "dfs(row, col, path):\n  Base: if row == m-1 AND col == n-1\n    add path; return\n\n  Block: if unsafe cell -> return\n\n  State: row, col, path, visited\n  mark visited[row][col]\n\n  Transition U/R/D/L:\n    dfs(nextRow, nextCol, path + moveChar)\n\n  Undo:\n    visited[row][col] = false"
      },
      "CombinationSumIII": {
            "prompt": "Before reading: what two counters must both be satisfied before saving?",
            "steps": [
                  "Base/save condition: target == 0 and digitsLeft == 0 means the path is valid.",
                  "State carried: idx, remaining target, digitsLeft, and path.",
                  "Transition A: pick current digit, reduce target, reduce digitsLeft, recurse, then undo.",
                  "Transition B: skip current digit and move forward."
            ],
            "skeleton": "dfs(idx, target, digitsLeft, path):\n  Base: if target == 0 AND digitsLeft == 0\n    add copy(path); return\n\n  Block: if digitsLeft == 0 OR idx == 9 OR target < 0\n    return\n\n  State: idx, target, digitsLeft, path\n\n  Transition A: pick digit idx\n    dfs(idx + 1, target - digit, digitsLeft - 1)\n    undo\n\n  Transition B: skip digit idx\n    dfs(idx + 1, target, digitsLeft)"
      },
      "LetterCombinationsOfPhoneNumber": {
            "prompt": "Before reading: for each digit, do you pick/skip, or must you choose exactly one mapped letter?",
            "steps": [
                  "Base/save condition: idx == digits.length() means the path has one letter per digit.",
                  "State carried: idx, digits, keypad map, and StringBuilder path.",
                  "Allowed transitions: for each mapped letter of digits[idx], append it and recurse to idx + 1.",
                  "Undo step: delete the appended letter before trying the next mapped letter."
            ],
            "skeleton": "dfs(idx, path):\n  Base: if idx == digits.length\n    add path.toString()\n    return\n\n  State: idx, digits, keypad map, path\n\n  for letter in map[digits[idx]]:\n    Transition: choose this letter\n      path.append(letter)\n      dfs(idx + 1, path)\n      undo delete last char"
      },
      "SplitStringIntoMaxNuoOfUniqueStrings": {
            "prompt": "Before reading: after choosing s[idx..i], where must the next recursion start?",
            "steps": [
                  "Base/save condition: idx == s.length() means the whole string has been split, so update max with set.size().",
                  "State carried: idx, the original string, and a HashSet of already-used chunks.",
                  "Allowed transitions: try every substring from idx to i; choose it only if it is not already in the set.",
                  "Undo step: remove the exact substring after recursion so sibling choices start with the clean set."
            ],
            "skeleton": "dfs(idx, used):\n  Base: if idx == s.length\n    update max with used.size\n    return\n\n  State: idx, used substrings\n\n  for end from idx to n-1:\n    part = s[idx..end]\n\n    Block: if part already used\n      continue\n\n    Transition: choose part\n      used.add(part)\n      dfs(end + 1, used)\n      undo used.remove(part)"
      }
};

    const definingMoves = {
      "SubsequencePatternsTheory": "Base: idx == n -> save/check\npick current -> recurse -> undo\nskip current -> recurse\nadd constraints as state",
      "BacktrackingScaleTheory": "Depth n is not the issue\nbranch count 2^n is the issue\nn<=20 okay, n=200 impossible\nswitch to DP/memo/math",
      "BacktrackingSaveTimingTheory": "Ask: if I stop here, is path valid?\nyes -> save before choices\nsuccess-only -> save at condition\ncomplete-only -> save at full length",
      "PowXN": "State: x, power as long\nBase: power 0 -> 1\neven -> x*x, power/2\nnegative -> reciprocal",
      "CountGoodNumbers": "State: base, exponent\nBase: exponent 0 -> 1\neven -> square/halve\nodd -> consume one base",
      "SortStack": "Base: stack empty -> return\nsort smaller stack\ninsert held top in sorted spot\nrestore blockers",
      "ReverseAStack": "Base: stack empty -> return\npop top, reverse rest\ninsert held top at bottom\nrestore blockers",
      "AtoIRecurse": "State: index, sign, result\nBase: non-digit/end -> stop\ntransitions: spaces -> sign -> digits\nclamp while building",
      "BinaryWithoutConsecutiveOnes": "Base: len == n -> save\n0 allowed always\n1 only if last != 1",
      "BinaryWithoutConsecutiveZeroes": "Base: len == n -> save\n1 allowed always\n0 only if last != 0",
      "GenerateParanthesis": "Base: open=closed=n -> save\nopen<n -> add (\nclosed<open -> add )\nundo after each choice",
      "PowerSet": "Base: idx == n -> save\ninclude char -> recurse -> undo\nskip char -> recurse",
      "SubSet": "Base: idx == n -> copy path\nskip nums[idx]\npick nums[idx] -> recurse -> undo",
      "CountSubsequenceWithSumK": "Base: idx == n -> 1/0\npick adds to sum\nskip keeps sum\nreturn pickCount + skipCount",
      "CheckSubsequenceWIthSumK": "Base: idx == n -> sum == k\npick branch OR skip branch\nreturn true as soon as one works",
      "PartitionEqualsSubsetSum": "Odd total -> false\ntarget = total/2\ncurrent recursion = subset-sum exists\nTLE until DP/memo",
      "CombinationSum": "pick current -> stay on idx\nskip current -> idx + 1\nsum > target blocks\nidx == n saves only exact target",
      "CombinationSumII": "sort first\nskip only same-depth duplicate siblings\nsecond equal can be deeper valid choice\npick -> recurse i+1",
      "SubsetSumI": "Base: idx == n -> save currSum\nskip keeps sum\npick adds arr[idx]\nsort final sums if required",
      "SubsetII": "Save path at entry\nduplicate rule is only i > idx\npick -> recurse i+1 -> undo",
      "PalindromePartitioning": "Base: idx == n -> save partition\nslide end from idx\nonly palindrome piece recurses\ncut -> dfs(end+1) -> undo",
      "WordSearch": "Start from matching first char\nmark cell visited\nmove only to next matching neighbor\nfailed branch -> unmark",
      "NQueens": "Row is the recursion level\ntry every column\nsafe means north/NW/NE clear\nplace -> next row -> undo",
      "RatMaze": "Path is the answer string\nmark current cell\ntry U/R/D/L\nappend move char -> dfs -> unmark",
      "CombinationSumIII": "Need target == 0 AND digitsLeft == 0\npick digit once -> i+1\nskip digit -> i+1",
      "LetterCombinationsOfPhoneNumber": "At each digit, choose exactly one mapped letter\nappend -> recurse idx+1 -> undo\nbase saves full-length path",
      "SplitStringIntoMaxNuoOfUniqueStrings": "Try every chunk s[idx..i]\nif unseen: add -> recurse i+1 -> remove\nbase updates max with set size"
};

    const solvedOrder = [
      "SubsequencePatternsTheory",
      "BacktrackingScaleTheory",
      "BacktrackingSaveTimingTheory",
      "PowXN",
      "CountGoodNumbers",
      "SortStack",
      "ReverseAStack",
      "AtoIRecurse",
      "BinaryWithoutConsecutiveOnes",
      "BinaryWithoutConsecutiveZeroes",
      "GenerateParanthesis",
      "PowerSet",
      "SubSet",
      "CountSubsequenceWithSumK",
      "CheckSubsequenceWIthSumK",
      "PartitionEqualsSubsetSum",
      "CombinationSum",
      "CombinationSumII",
      "SubsetSumI",
      "SubsetII",
      "CombinationSumIII",
      "LetterCombinationsOfPhoneNumber",
      "PalindromePartitioning",
      "WordSearch",
      "NQueens",
      "RatMaze",
      "SplitStringIntoMaxNuoOfUniqueStrings"
];

    cards.sort((a, b) => solvedOrder.indexOf(a.name) - solvedOrder.indexOf(b.name));
    cards.forEach(card => Object.assign(card, recallDetails[card.name], {
      definingMove: definingMoves[card.name]
    }));
    cards.forEach((card, index) => {
      card.isTheory = card.name.endsWith("Theory");
      card.problemNo = index + 1;
      card.problemLabel = `#${String(index + 1).padStart(2, "0")}`;
    });

    const cardsEl = document.getElementById("cards");
    const searchEl = document.getElementById("search");
    const emptyEl = document.getElementById("empty");
    const quickModeEl = document.getElementById("quickMode");
    const exportPdfEl = document.getElementById("exportPdf");
    const totalCountEl = document.getElementById("totalCount");
    const incrementAllEl = document.getElementById("incrementAll");
    const resetAllEl = document.getElementById("resetAll");
    let quickMode = true;
    const expandedQuickCards = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function storageKey(cardName) {
      return `dsa-revision:backtracking:${cardName}`;
    }

    function readRevision(cardName) {
      try {
        const raw = localStorage.getItem(storageKey(cardName));
        if (!raw) return { count: 0, last: "" };
        const parsed = JSON.parse(raw);
        return {
          count: Number(parsed.count) || 0,
          last: typeof parsed.last === "string" ? parsed.last : ""
        };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(cardName, revision) {
      try {
        localStorage.setItem(storageKey(cardName), JSON.stringify(revision));
      } catch {
        // Keep the page usable even if browser storage is unavailable.
      }
    }

    function formatLastRevised(value) {
      if (!value) return "Last revised: never";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return `Last revised: ${value}`;
      return `Last revised: ${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
    }

    function todayLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderRevisionControls(card) {
      const revision = readRevision(card.name);
      return `
        <div class="revision-controls">
          <span class="revision-pill">Revised ${revision.count}x</span>
          <span class="revision-pill">${escapeHtml(formatLastRevised(revision.last))}</span>
          <button class="revision-button" type="button" data-action="increment" data-card="${escapeHtml(card.name)}">+1</button>
          <button class="revision-button reset" type="button" data-action="reset" data-card="${escapeHtml(card.name)}">Reset</button>
        </div>
      `;
    }

    function renderFullCard(card, extraClass = "") {
      const bruteForce = card.bruteForce || "Start with the simplest correct approach that directly follows the problem statement, then compare it with the optimized move above.";
      const alternates = card.alternates || ["No strong alternate approach needed for quick revision; focus on the core move."];
      return `
        <article class="card ${escapeHtml(card.difficulty.toLowerCase())} ${card.isTheory ? "theory" : ""} ${extraClass}">
          <div class="card-head">
            <div>
              <h2 class="problem-title"><span><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</span></h2>
              ${renderRevisionControls(card)}
              <div class="meta-line">
                <span>${escapeHtml(card.label)}</span>
                <span>${escapeHtml(card.difficulty)}</span>
                <a href="${escapeHtml(card.source)}">Source</a>
                ${card.leetcode ? `<a href="${escapeHtml(card.leetcode)}" target="_blank" rel="noreferrer">LeetCode</a>` : ""}
              </div>
            </div>
            <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
          </div>
          <div class="body">
            <div class="recall-prompt">${escapeHtml(card.prompt)}</div>
            <div class="description">
              <b>Problem description</b>
              ${escapeHtml(card.description)}
            </div>
            <div class="sample">
              <div class="sample-box">
                <b>Input</b>
                <code>${escapeHtml(card.input)}</code>
              </div>
              <div class="sample-box">
                <b>Output</b>
                <code>${escapeHtml(card.output)}</code>
              </div>
            </div>
            <div class="cost-strip">
              <div class="cost-item">
                <span class="cost-label">Time</span>
                <span class="cost-value">${escapeHtml(card.time)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Space</span>
                <span class="cost-value">${escapeHtml(card.space)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Data structures</span>
                <span class="cost-value">${escapeHtml(card.structures)}</span>
              </div>
            </div>
            ${card.timeWhy ? `<div class="section time-why"><b>Why this complexity</b>${escapeHtml(card.timeWhy)}</div>` : ""}
            <div class="section-grid">
              <div class="section">
                <b>When to recognize it</b>
                ${escapeHtml(card.recognize)}
              </div>
              ${card.variantLens ? `<div class="section variant-lens"><b>Variant lens</b>${escapeHtml(card.variantLens)}</div>` : ""}
              <div class="section">
                <b>Visual hook</b>
                <div class="visual">${renderVisual(card.visual)}</div>
                ${renderSteps(card.steps)}
                <span class="hint">${escapeHtml(card.visualText)}</span>
              </div>
              <div class="section">
                <b>Core move</b>
                ${escapeHtml(card.core)}
              </div>
              <div class="section">
                <b>Code skeleton</b>
                <code>${escapeHtml(card.skeleton)}</code>
              </div>
              <div class="section brute-force">
                <b>Brute force / baseline</b>
                ${escapeHtml(bruteForce)}
              </div>
              <div class="section alternates">
                <b>Alternate approaches</b>
                <ul class="gotchas">${alternates.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
              <div class="section full">
                <b>Bug magnets</b>
                <ul class="gotchas">${card.gotchas.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderQuickReview(cardsToRender) {
      return `<div class="quick-review">${cardsToRender.map(card => {
        const expanded = expandedQuickCards.has(card.name);
        return `
          <div class="quick-item">
            <article class="quick-row ${escapeHtml(card.difficulty.toLowerCase())} ${card.isTheory ? "theory" : ""} ${expanded ? "expanded" : ""}" data-expand-card="${escapeHtml(card.name)}" role="button" tabindex="0" aria-expanded="${expanded}">
              <span class="expand-cue" aria-hidden="true">⌄</span>
              <div>
                <div class="quick-title">
                  <strong><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</strong>
                  <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
                </div>
                ${renderRevisionControls(card)}
                <div class="quick-summary">
                  <span class="quick-approach">${escapeHtml(card.label)}</span>
                  ${card.variantLens ? `<span class="quick-variant"><b>Variant</b> ${escapeHtml(card.variantLens)}</span>` : ""}
                  <div class="quick-facts">
                    <span class="quick-fact"><b>Time</b> ${escapeHtml(card.time)}</span>
                    <span class="quick-fact"><b>Space</b> ${escapeHtml(card.space)}</span>
                  </div>
                  <span class="quick-uses"><b>Uses</b> ${escapeHtml(card.structures)}</span>
                </div>
              </div>
              <div>
                <span class="quick-label">Recall prompt</span>
                <span class="quick-text">${escapeHtml(card.prompt)}</span>
              </div>
              <div>
                <span class="quick-label">Defining move</span>
                <code>${escapeHtml(card.definingMove)}</code>
              </div>
              <div>
                <span class="quick-label">Bug magnet</span>
                <span class="quick-text">${escapeHtml(card.gotchas[0])}</span>
              </div>
            </article>
            ${expanded ? renderFullCard(card, "quick-expanded-card") : ""}
          </div>
        `;
      }).join("")}</div>`;
    }

    function toggleQuickCard(cardName) {
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    }

    function setReviewMode(nextQuickMode) {
      quickMode = nextQuickMode;
      quickModeEl.classList.toggle("active", quickMode);
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.problemLabel,
          card.label,
          card.difficulty,
          card.time,
          card.space,
          card.structures,
          card.leetcode,
          card.source,
          card.description,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.prompt,
          card.skeleton,
          card.steps.join(" "),
          card.gotchas.join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = renderQuickReview(visible);
        emptyEl.style.display = visible.length ? "none" : "block";
        return;
      }

      cardsEl.className = "cards";
      cardsEl.innerHTML = visible.map(card => renderFullCard(card)).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action][data-card]");
      if (button) {
        const cardName = button.dataset.card;
        if (button.dataset.action === "increment") {
          const current = readRevision(cardName);
          writeRevision(cardName, {
            count: current.count + 1,
            last: todayLocalDate()
          });
        }
        if (button.dataset.action === "reset") {
          writeRevision(cardName, { count: 0, last: "" });
        }
        render();
        return;
      }
      const quickRow = event.target.closest("[data-expand-card]");
      if (quickRow) toggleQuickCard(quickRow.dataset.expandCard);
    });
    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const quickRow = event.target.closest("[data-expand-card]");
      if (!quickRow || event.target.closest("button, a")) return;
      event.preventDefault();
      toggleQuickCard(quickRow.dataset.expandCard);
    });
    incrementAllEl.addEventListener("click", () => {
      const today = todayLocalDate();
      cards.forEach(card => {
        const current = readRevision(card.name);
        writeRevision(card.name, {
          count: current.count + 1,
          last: today
        });
      });
      render();
    });
    resetAllEl.addEventListener("click", () => {
      if (!window.confirm("Reset revision counts and dates for all backtracking problems?")) return;
      cards.forEach(card => writeRevision(card.name, { count: 0, last: "" }));
      render();
    });
    quickModeEl.addEventListener("click", () => {
      setReviewMode(!quickMode);
      render();
    });
    exportPdfEl.addEventListener("click", () => {
      const previousQuickMode = quickMode;
      const previousSearch = searchEl.value;
      const previousExpanded = new Set(expandedQuickCards);

      searchEl.value = "";
      expandedQuickCards.clear();
      setReviewMode(false);
      render();

      const restoreAfterPrint = () => {
        searchEl.value = previousSearch;
        expandedQuickCards.clear();
        previousExpanded.forEach(name => expandedQuickCards.add(name));
        setReviewMode(previousQuickMode);
        render();
        window.removeEventListener("afterprint", restoreAfterPrint);
      };

      window.addEventListener("afterprint", restoreAfterPrint);
      window.setTimeout(() => window.print(), 50);
    });
    totalCountEl.textContent = `${cards.length} problem${cards.length === 1 ? "" : "s"}`;
    render();
  </script>
</body>
</html>
