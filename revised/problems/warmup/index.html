<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warmup Revision</title>
  <style>
    :root {
      --ink: #17211c;
      --muted: #627067;
      --line: #d7dfd6;
      --paper: #f5f7f1;
      --panel: #ffffff;
      --green: #2f6f4e;
      --green-soft: #e8f2eb;
      --blue: #3f6f93;
      --blue-soft: #e8f1f6;
      --gold: #ad7924;
      --gold-soft: #fbf0d8;
      --red: #a9483d;
      --red-soft: #f8e7e4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    a {
      color: var(--green);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 10px 0 0;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(26, 37, 31, .08);
      overflow: hidden;
      min-width: 0;
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #fbfcf8;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .source {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #cfe0d2;
      color: #28593f;
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcf8;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #26372e;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full { grid-column: 1 / -1; }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
    }

    @media (max-width: 620px) {
      .sample,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .section.full { grid-column: auto; }
      .card-head { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <h1>Warmup Revision</h1>
        <p class="subtitle">Fast recall cards for the completed warmup package. Read the problem name, picture the hook, then check the sample and gotchas before opening the Java file.</p>
      </div>
      <input id="search" class="search" type="search" placeholder="Search warmup cards">
    </header>

    <section id="cards" class="cards"></section>
    <div id="empty" class="empty">No matching warmup cards.</div>
  </main>

  <script>
    const cards = [
      {
        name: "CheckIfStringsEquivalent",
        source: "../com/arvind/revision/warmup/CheckIfStringsEquivalent.java",
        label: "Chunked strings",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/check-if-two-string-arrays-are-equivalent/",
        input: 'word1 = ["ab", "c"]\nword2 = ["a", "bc"]',
        output: "true",
        recognize: "When two string arrays are really just two broken-up versions of a final string.",
        visual: [["ab", "c"], ["a", "bc"]],
        visualText: "Mentally flatten both rows into one line: [ab][c] -> abc and [a][bc] -> abc.",
        core: "Append all pieces of word1 into one StringBuilder, append all pieces of word2 into another, then compare the final text.",
        gotchas: ["Use content comparison, not reference comparison.", "If this becomes huge, compare character streams instead of building both full strings."]
      },
      {
        name: "ClosestToZero",
        source: "../com/arvind/revision/warmup/ClosestToZero.java",
        label: "Best-so-far scan",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/find-closest-number-to-zero/",
        input: "nums = [2, -1, 1]",
        output: "1",
        recognize: "When the answer is one best element and each number can be judged independently.",
        visual: [["2", "-1", "1"]],
        visualText: "Draw a number line around zero. Distance decides first; if distance ties, choose the right-side positive number.",
        core: "Track the current closest number. Replace it when absolute value is smaller, or when absolute value ties and the new value is larger.",
        gotchas: ["Tie rule is the entire trick: prefer +x over -x.", "Initialize from the array if possible; sentinel values can make tie logic feel weird."]
      },
      {
        name: "ContainsDuplicate",
        source: "../com/arvind/revision/warmup/ContainsDuplicate.java",
        label: "Seen set",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/contains-duplicate/",
        input: "nums = [1, 2, 3, 4, 4]",
        output: "Result: true",
        recognize: "When the question asks whether anything repeats and you do not need the repeated positions.",
        visual: [["1", "2", "3", "4", "4"]],
        visualText: "Imagine dropping every number into a seen bucket. If it is already in the bucket, stop.",
        core: "Scan left to right. If seen already contains the number, return true; otherwise add it and continue.",
        gotchas: ["Return immediately when a duplicate appears.", "A set keeps this linear; sorting is extra work and mutates order."]
      },
      {
        name: "FindNumbersWithEvenDigits",
        source: "../com/arvind/revision/warmup/FindNumbersWithEvenDigits.java",
        label: "Digit count",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/find-numbers-with-even-number-of-digits/",
        input: "nums = [12, 345, 2, 6, 7896]",
        output: "2",
        recognize: "When the value itself does not matter, only the length of its decimal representation.",
        visual: [["12", "345", "2", "6", "7896"]],
        visualText: "Read each number as text blocks: 12 has two blocks, 345 has three, 7896 has four.",
        core: "Turn each number into text and count its length, or divide by 10 repeatedly. Add one when the count is even.",
        gotchas: ["If using math, remember 0 has one digit.", "String conversion is perfectly fine for this warmup problem."]
      },
      {
        name: "FlippingImage",
        source: "../com/arvind/revision/warmup/FlippingImage.java",
        label: "Mirror and invert",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/flipping-an-image/",
        input: "image = [[1,1,0,0], [1,0,0,1], [0,1,1,1], [1,0,1,0]]",
        output: "[[1,1,0,0], [0,1,1,0], [0,0,0,1], [1,0,1,0]]",
        recognize: "When each row must be mirrored and each binary value must be toggled.",
        visual: [["1", "1", "0", "0"], ["1", "1", "0", "0"]],
        visualText: "Treat every row like a mirror. Left receives inverted right; right receives inverted old left.",
        core: "For each row, keep left and right pointers. Put invert(right) on the left and invert(old left) on the right.",
        gotchas: ["When left meets right, still invert the middle cell.", "Use a saved temp before overwriting the left value."]
      },
      {
        name: "GoodPair",
        source: "../com/arvind/revision/warmup/GoodPair.java",
        label: "Frequency creates pairs",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/number-of-good-pairs/",
        input: "nums = [1, 2, 3, 1, 1, 3]",
        output: "4",
        recognize: "When every new duplicate can pair with all earlier copies of the same number.",
        visual: [["1", "2", "3", "1", "1", "3"]],
        visualText: "Think handshake count: the new 1 shakes hands with every previous 1.",
        core: "Keep a frequency map. For each number, add its current frequency to the answer, then increment that frequency.",
        gotchas: ["Add before incrementing, because the current item only pairs with previous items.", "This is easier than computing nC2 at the end."]
      },
      {
        name: "IsSubsequence",
        source: "../com/arvind/revision/warmup/IsSubsequence.java",
        label: "Order check",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/is-subsequence/",
        input: 's = "abc"\nt = "ahbgdc"',
        output: "true",
        recognize: "When one string only needs to appear in order inside another string, not contiguously.",
        visual: [["a", "b", "c"], ["a", "h", "b", "g", "d", "c"]],
        visualText: "Keep a finger on s. Sweep across t and move the s finger only when the current needed char appears.",
        core: "Scan t with one pointer. When t matches the current char of s, advance the s pointer. Success means all of s was consumed.",
        gotchas: ["Empty s should return true.", "Guard `s.charAt(i)` when i reaches s.length(); otherwise empty or fully matched s can crash."]
      },
      {
        name: "MajorityElement",
        source: "../com/arvind/revision/warmup/MajorityElement.java",
        label: "Vote cancellation",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/majority-element/",
        input: "nums = [2, 2, 1, 1, 1, 2, 2]",
        output: "2",
        recognize: "When the problem guarantees one value appears more than half the array.",
        visual: [["2", "2", "1", "1", "1", "2", "2"]],
        visualText: "Picture values fighting in pairs. Different values cancel; the true majority has extra copies left.",
        core: "Keep a candidate and count. Same value increments count, different value decrements. When count hits zero, choose a new candidate.",
        gotchas: ["This works without verification only when the majority is guaranteed.", "The idea is cancellation, not counting exact frequencies."]
      },
      {
        name: "MergeStringsAlternately",
        source: "../com/arvind/revision/warmup/MergeStringsAlternately.java",
        label: "Alternating append",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/merge-strings-alternately/",
        input: 'word1 = "abcd"\nword2 = "pq"',
        output: "apbqcd",
        recognize: "When the output is formed by weaving two strings character by character.",
        visual: [["a", "b", "c", "d"], ["p", "q"], ["a", "p", "b", "q", "c", "d"]],
        visualText: "Zip the two rows together: top, bottom, top, bottom; then drag the leftover tail to the end.",
        core: "Use two indexes and a StringBuilder. Append word1[i], word2[j] while both are in range, then append remaining substrings.",
        gotchas: ["Do not forget leftovers from the longer string.", "StringBuilder avoids repeated string concatenation."]
      },
      {
        name: "MoveZeroes",
        source: "../com/arvind/revision/warmup/MoveZeroes.java",
        label: "Stable compaction",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/move-zeroes/",
        input: "nums = [0, 1, 3, 0, 12]",
        output: "[1, 3, 12, 0, 0]",
        recognize: "When unwanted values move to the end but the wanted values must keep their order.",
        visual: [["0", "1", "3", "0", "12"], ["1", "3", "12", "0", "0"]],
        visualText: "Imagine a write slot moving forward only when a non-zero is copied into it. Everything behind write is compacted.",
        core: "Use a write pointer for the next non-zero slot. Scan all values, copy non-zero values to write, then fill the rest with zero.",
        gotchas: ["This is not a sorting problem.", "The generic template should scan from index 0 so the first element is handled cleanly."]
      },
      {
        name: "Pangram",
        source: "../com/arvind/revision/warmup/Pangram.java",
        label: "Alphabet checklist",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/check-if-the-sentence-is-pangram/",
        input: '"This is not a pangram"\n"TheQuickBrownFoxJumpsOverTheLazyDog"',
        output: "false\ntrue",
        recognize: "When the task is presence of all alphabet letters, not order or frequency.",
        visual: [["a", "b", "c", "...", "z"]],
        visualText: "Picture 26 boxes from a to z. Every seen character checks one box; all boxes must be checked.",
        core: "Normalize each character, map a-z to indexes 0-25, mark/count each letter, then ensure none are missing.",
        gotchas: ["Ignore characters outside a-z if input can contain spaces or punctuation.", "You can early-return once all 26 letters have been seen."]
      },
      {
        name: "ReverseVowels",
        source: "../com/arvind/revision/warmup/ReverseVowels.java",
        label: "Vowel swap",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/reverse-vowels-of-a-string/",
        input: '"hello"\n"DesignGUrus"',
        output: "holle\nDusUgnGires",
        recognize: "When only one character class moves and all other characters stay anchored.",
        visual: [["h", "e", "l", "l", "o"], ["h", "o", "l", "l", "e"]],
        visualText: "Two magnets search inward for vowels. When both magnets catch vowels, swap them.",
        core: "Use two pointers. Skip non-vowels on each side. When both sides are vowels, swap and move inward.",
        gotchas: ["Include uppercase vowels by normalizing before lookup.", "After a swap, move both pointers or you can keep revisiting the same vowels."]
      },
      {
        name: "ShortestWordDistance",
        source: "../com/arvind/revision/warmup/ShortestWordDistance.java",
        label: "Last seen positions",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/shortest-word-distance/",
        input: 'words = ["the","quick","brown","fox","jumps","over","the","lazy","dog"]\nword1 = "fox", word2 = "dog"',
        output: "5",
        recognize: "When distance depends only on the latest seen positions of two target words.",
        visual: [["the", "quick", "brown", "fox", "...", "dog"]],
        visualText: "Drop pins on the latest word1 and word2 positions. Every new pin gives a fresh distance candidate.",
        core: "During one scan, update idx1 or idx2 when you see either word. Once both exist, update the minimum absolute difference.",
        gotchas: ["Single pass is simpler than storing every index.", "If word1 and word2 can be the same word, that is a different variant."]
      },
      {
        name: "Sqrt",
        source: "../com/arvind/revision/warmup/Sqrt.java",
        label: "Binary answer search",
        difficulty: "Medium",
        leetcode: "https://leetcode.com/problems/sqrtx/",
        input: "x = 2147395600",
        output: "46340",
        recognize: "When the answer is a number in a range and you can test whether a guess is too small or too large.",
        visual: [["0", "...", "mid", "...", "x/2"]],
        visualText: "Put mid on the number line. mid squared tells which half of possible roots can be discarded.",
        core: "Binary search candidate roots. If mid*mid is less than x, move left up. If greater, move right down. Return right after crossing.",
        gotchas: ["Use long for mid * mid to avoid overflow.", "Return right at the end because left has moved to the first too-large value."]
      },
      {
        name: "ValidAnagram",
        source: "../com/arvind/revision/warmup/ValidAnagram.java",
        label: "Frequency balance",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/valid-anagram/",
        input: 's = "listen"\nt = "silent"',
        output: "true",
        recognize: "When order does not matter, but exact character counts do.",
        visual: [["l:+1", "i:+1", "s:+1"], ["s:-1", "i:-1", "l:-1"]],
        visualText: "Use a balance scale per letter: first string adds weight, second string removes it. All scales must end at zero.",
        core: "Check lengths first. Increment counts for s, decrement counts for t, then verify every count is zero.",
        gotchas: ["Array size 26 assumes lowercase English letters.", "For Unicode or mixed characters, use a map instead."]
      },
      {
        name: "ValidPalindrome",
        source: "../com/arvind/revision/warmup/ValidPalindrome.java",
        label: "Clean two-pointer compare",
        difficulty: "Easy",
        leetcode: "https://leetcode.com/problems/valid-palindrome/",
        input: '"A man, a plan, a canal, Panama!"\n"Was it a car or a cat I saw?"\n"123321"',
        output: "true\ntrue\ntrue",
        recognize: "When you compare a string from both ends while ignoring non-essential characters.",
        visual: [["A", ",", "m", "...", "a"]],
        visualText: "Two pointers walk inward. Each pointer skips noise until both point at real comparable characters.",
        core: "Move left and right inward. If a side is not alphanumeric, skip it. Once both are valid, compare lowercase characters.",
        gotchas: ["Do the skip before compare.", "Only move both pointers after you have compared two valid characters."]
      }
    ];

    const cardsEl = document.getElementById("cards");
    const searchEl = document.getElementById("search");
    const emptyEl = document.getElementById("empty");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.label,
          card.difficulty,
          card.leetcode,
          card.source,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.gotchas.join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      cardsEl.innerHTML = visible.map(card => `
        <article class="card">
          <div class="card-head">
            <div>
              <h2>${escapeHtml(card.name)}</h2>
              <a class="source" href="${escapeHtml(card.source)}">${escapeHtml(card.source)}</a>
            </div>
            <div class="head-actions">
              <span class="badge">${escapeHtml(card.label)}</span>
              <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
              ${card.leetcode ? `<a class="leetcode" href="${escapeHtml(card.leetcode)}" target="_blank" rel="noreferrer">LeetCode</a>` : ""}
            </div>
          </div>
          <div class="body">
            <div class="sample">
              <div class="sample-box">
                <b>Input</b>
                <code>${escapeHtml(card.input)}</code>
              </div>
              <div class="sample-box">
                <b>Output</b>
                <code>${escapeHtml(card.output)}</code>
              </div>
            </div>
            <div class="section-grid">
              <div class="section">
                <b>When to recognize it</b>
                ${escapeHtml(card.recognize)}
              </div>
              <div class="section">
                <b>Visual hook</b>
                <div class="visual">${renderVisual(card.visual)}</div>
                <span class="hint">${escapeHtml(card.visualText)}</span>
              </div>
              <div class="section">
                <b>Core move</b>
                ${escapeHtml(card.core)}
              </div>
              <div class="section">
                <b>Gotchas</b>
                <ul class="gotchas">${card.gotchas.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        </article>
      `).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    render();
