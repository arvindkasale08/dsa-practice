<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fast & Slow Pointers Revision</title>
  <style>
    :root {
      --ink: #18221e;
      --muted: #5e6d66;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --paper: #edf2ee;
      --panel: #fffefa;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      border-top: 4px solid var(--green);
    }

    a {
      color: var(--green);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--green-dark); }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    .back-link:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
      color: #13241d;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .subtitle {
      margin: 0 0 18px;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .card.easy { border-color: #bad9ca; border-top-color: var(--green); }
    .card.medium { border-color: #e6cf9b; border-top-color: var(--gold); }
    .card.hard { border-color: #e5c1bc; border-top-color: var(--red); }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #f8faf7;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #bad9ca;
      color: var(--green-dark);
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #213c30;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .section.brute-force {
      border-color: #e6cf9b;
      background: #fffdf6;
    }

    .section.alternates {
      border-color: #bfd3e1;
      background: #f7fbff;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    .quick-review {
      display: grid;
      gap: 8px;
    }

    .quick-item {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) minmax(180px, .85fr) minmax(220px, 1.2fr) minmax(220px, 1.2fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
    }

    .quick-row.easy { border-color: #bad9ca; border-left-color: var(--green); }
    .quick-row.medium { border-color: #e6cf9b; border-left-color: var(--gold); }
    .quick-row.hard { border-color: #e5c1bc; border-left-color: var(--red); }

    .quick-row:hover,
    .quick-row:focus-visible,
    .quick-row.expanded {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
    }

    .quick-title .difficulty {
      min-height: 22px;
      padding: 2px 8px;
    }

    .quick-summary {
      display: grid;
      gap: 5px;
      margin-top: 6px;
    }

    .quick-approach {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--blue);
      background: #eef6fa;
      padding: 3px 7px;
      color: #294a5e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .quick-fact {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7faf8;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-fact b,
    .quick-uses b {
      color: #3c4d43;
      font-size: 10px;
      text-transform: uppercase;
    }

    .quick-uses {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-label {
      color: #3c4d43;
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .tools { justify-content: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .section.full { grid-column: auto; }
      .card-head { grid-template-columns: 1fr; }
      .tools { display: grid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <div class="title-row">
          <h1>Fast & Slow Pointers Revision</h1>
          <span id="totalCount" class="count-pill"></span>
          <div class="page-revision-controls">
            <button id="incrementAll" class="revision-button" type="button">+1 All</button>
            <button id="resetAll" class="revision-button reset" type="button">Reset All</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Search fast & slow pointers cards">
        <button id="quickMode" class="mode-button active" type="button">Card Review</button>
      </div>
    </header>
    <p class="subtitle">Fast recall cards for the current fast and slow pointers package. Picture the runner movement, then check the sample and bug magnets before opening the Java file.</p>

    <section id="cards" class="cards"></section>
    <div id="empty" class="empty">No matching fast & slow pointers cards.</div>
  </main>

  <script>
    const cards = [
      {
        "name": "LinkedListCycle",
        "source": "../com/arvind/revision/fastslow/LinkedListCycle.java",
        "label": "Runner collision check",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/linked-list-cycle/",
        "description": "Given the head of a linked list, return true if any node can be reached again by following next pointers, otherwise return false.",
        "time": "O(n)",
        "space": "O(1)",
        "structures": "Slow pointer, fast pointer, linked list nodes",
        "input": "head = [3, 2, 0, -4], pos = 1",
        "output": "true",
        "recognize": "When following next pointers may eventually loop back to an earlier node, and extra visited storage is not needed.",
        "visual": [
          [
            "3",
            "2",
            "0",
            "-4"
          ],
          [
            "slow +1",
            "fast +2"
          ],
          [
            "cycle -> runners meet",
            "no cycle -> fast hits null"
          ]
        ],
        "visualText": "Imagine two runners on the same track. If the track loops, the fast runner eventually catches the slow runner. If the track ends, fast reaches null.",
        "core": "Move slow one node and fast two nodes while fast and fast.next exist. If they ever point to the same node, a cycle exists. If fast reaches the end, there is no cycle.",
        "bruteForce": "Store every visited node in a HashSet and return true when a node repeats. It is straightforward but uses O(n) extra space.",
        "alternates": [
          "Temporarily marking nodes can detect repeats, but it mutates the list and is usually not acceptable.",
          "Floyd cycle detection is preferred because it keeps O(1) space and does not modify nodes."
        ],
        "gotchas": [
          "Compare node references, not node values.",
          "Check fast and fast.next before moving fast two steps.",
          "A null head or one-node list without a self-loop should return false."
        ]
      },
      {
        "name": "LinkedListCycleII",
        "source": "../com/arvind/revision/fastslow/LinkedListCycleII.java",
        "label": "Find loop entry",
        "difficulty": "Medium",
        "leetcode": "https://leetcode.com/problems/linked-list-cycle-ii/",
        "description": "Given the head of a linked list, return the exact node where the cycle begins. If the list has no cycle, return null.",
        "time": "O(n)",
        "space": "O(1)",
        "structures": "Slow pointer, fast pointer, linked list nodes",
        "input": "head = [3, 2, 0, -4], pos = 1",
        "output": "node with value 2",
        "recognize": "When a linked list may loop and the answer is not just whether a loop exists, but the first node of the loop.",
        "visual": [
          [
            "3",
            "2",
            "0",
            "-4"
          ],
          [
            "phase 1: slow +1, fast +2",
            "meet somewhere inside loop"
          ],
          [
            "phase 2: head +1, meet +1",
            "second meeting = cycle start"
          ]
        ],
        "visualText": "First catch the fast runner inside the loop. Then restart one runner at head. When both move one step, they meet exactly at the loop door.",
        "core": "Use Floyd's first meeting to prove a cycle exists. Then reset one pointer to head and move both pointers one step at a time until they meet at the cycle entry node.",
        "bruteForce": "Put every visited node reference in a HashSet and return the first node seen twice. It is easy to reason about, but costs O(n) extra space.",
        "alternates": [
          "Temporarily tagging nodes can reveal the repeated node, but mutates the list and is unsafe for interview constraints.",
          "Floyd's two-phase method is the usual constant-space solution."
        ],
        "gotchas": [
          "After the first meeting, reset only one pointer to head; keep the other at the meeting point.",
          "In phase two, both pointers move one step, not fast by two.",
          "Return the node reference, not just the node value."
        ]
      },
      {
        "name": "HappyNumber",
        "source": "../com/arvind/revision/fastslow/HappyNumber.java",
        "label": "Digit-square cycle",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/happy-number/",
        "description": "Given a positive integer, repeatedly replace it with the sum of the squares of its digits. Return true if the chain reaches 1, and false if it falls into a repeating cycle.",
        "time": "O(log n) per transform; bounded overall for int inputs",
        "space": "O(k) with visited set",
        "structures": "HashSet of seen numbers, digit loop",
        "input": "n = 2",
        "output": "false",
        "recognize": "When a value repeatedly transforms into another value and the process either reaches a target or repeats forever.",
        "visual": [
          [
            "2",
            "4",
            "16",
            "37"
          ],
          [
            "58",
            "89",
            "145",
            "42"
          ],
          [
            "20",
            "4 repeats",
            "cycle",
            "false"
          ]
        ],
        "visualText": "Picture each number as a station in a train route. A happy route reaches station 1. An unhappy route revisits an old station and loops forever.",
        "core": "Keep generating the digit-square sum. If the value becomes 1, return true. If a generated value was already seen, return false because the chain is cycling.",
        "bruteForce": "Manually simulate for a fixed number of iterations and hope it stops. That can work for small examples but has no clean correctness reason.",
        "alternates": [
          "Use Floyd's slow/fast pointers on the generated number sequence to detect the cycle in O(1) extra space.",
          "For base-10 integers, the sequence quickly falls into a small bounded range, so either a HashSet or Floyd is fast in practice."
        ],
        "gotchas": [
          "Check for a repeated number after generating the next value.",
          "The digit-square helper must consume all digits with modulo and division.",
          "Do not treat reaching any small number as success; only 1 means happy."
        ]
      },
      {
        "name": "MiddleOfLinkedList",
        "source": "../com/arvind/revision/fastslow/MiddleOfLinkedList.java",
        "label": "Runner midpoint",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/middle-of-the-linked-list/",
        "description": "Given the head of a singly linked list, return the middle node. If there are two middle nodes, return the second one.",
        "time": "O(n)",
        "space": "O(1)",
        "structures": "Slow pointer, fast pointer, linked list nodes",
        "input": "head = [1, 2, 3, 4, 5, 6]",
        "output": "node with value 4",
        "recognize": "When you need the halfway node of a linked list without first counting every node.",
        "visual": [
          [
            "1",
            "2",
            "3",
            "4",
            "5",
            "6"
          ],
          [
            "slow +1",
            "fast +2"
          ],
          [
            "fast ends",
            "slow at middle",
            "second middle"
          ]
        ],
        "visualText": "Imagine fast stretching the tape two nodes at a time while slow walks normally. When fast reaches the end, slow has covered exactly half the list.",
        "core": "Start slow and fast at head. Move slow one step and fast two steps while fast and fast.next exist. When the loop stops, slow is the required middle node.",
        "bruteForce": "Count the list length first, then walk length / 2 nodes from head. It is simple but uses two passes instead of one.",
        "alternates": [
          "Store nodes in an array and return array[size / 2], but that costs O(n) extra space.",
          "The slow/fast runner approach is the one-pass O(1) space version."
        ],
        "gotchas": [
          "For even length, this loop returns the second middle because slow moves before fast becomes null.",
          "Check fast and fast.next before moving fast two nodes.",
          "Return the node itself, not just its value."
        ]
      },
      {
        "name": "PalindromicLinkedList",
        "source": "../com/arvind/revision/fastslow/PalindromicLinkedList.java",
        "label": "Fold and compare",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/palindrome-linked-list/",
        "description": "Given the head of a singly linked list, return true if the node values read the same forward and backward, otherwise return false.",
        "time": "O(n)",
        "space": "O(1)",
        "structures": "Slow pointer, fast pointer, in-place linked list reversal",
        "input": "head = [1, 2, 3, 5, 5, 3, 2, 1]",
        "output": "true",
        "recognize": "When a linked list must be compared from both ends, but you cannot index backward like an array.",
        "visual": [
          [
            "1",
            "2",
            "3",
            "5",
            "5",
            "3",
            "2",
            "1"
          ],
          [
            "find middle",
            "reverse right half"
          ],
          [
            "1 vs 1",
            "2 vs 2",
            "3 vs 3",
            "5 vs 5"
          ]
        ],
        "visualText": "Fold the list at the middle. Reverse the right half so both halves face the same direction, then walk both sides together and compare values.",
        "core": "Use slow and fast to reach the middle. Reverse from slow onward. Compare the reversed half with the original head until the reversed half ends.",
        "bruteForce": "Copy all node values into an array, then use two indices from both ends. It is very simple, but costs O(n) extra space.",
        "alternates": [
          "Use recursion to compare front and back during unwinding, but it still uses O(n) call stack space.",
          "Restore the reversed half afterward if the caller expects the original list structure to remain unchanged."
        ],
        "gotchas": [
          "Save the next node before reversing a link, otherwise the rest of the list is lost.",
          "Compare only while the reversed second half is non-null.",
          "For odd length lists, starting reversal at slow includes the middle value, which still works because the compare stops on the shorter reversed walk."
        ]
      }
    ];

    const recallDetails = {
      "LinkedListCycle": {
        "prompt": "Before reading: what proves a linked list has a loop?",
        "steps": [
          "Move slow by one node and fast by two nodes.",
          "If fast reaches null, the list ends and has no cycle.",
          "If slow and fast meet by reference, both runners are inside the same loop."
        ],
        "skeleton": "slow = head; fast = head\nwhile fast != null and fast.next != null:\n  slow = slow.next\n  fast = fast.next.next\n  if slow == fast: return true\nreturn false"
      },
      "LinkedListCycleII": {
        "prompt": "Before reading: after the runners collide, where should one pointer restart?",
        "steps": [
          "First run slow and fast until they meet inside the cycle.",
          "Restart one pointer at head and leave the other at the meeting node.",
          "Move both one step at a time; their next meeting is the cycle entry."
        ],
        "skeleton": "slow = head; fast = head\nwhile fast != null and fast.next != null:\n  slow = slow.next\n  fast = fast.next.next\n  if slow == fast: break\nif no meeting: return null\nfast = head\nwhile slow != fast:\n  slow = slow.next\n  fast = fast.next\nreturn slow"
      },
      "HappyNumber": {
        "prompt": "Before reading: what proves the number chain will never reach 1?",
        "steps": [
          "Convert the current number into the sum of squared digits.",
          "If the new value is 1, the number is happy.",
          "If the new value was seen before, the route is cycling and cannot become happy."
        ],
        "skeleton": "seen = empty set\nadd n to seen\nwhile n != 1:\n  n = sumOfSquaredDigits(n)\n  if n in seen: return false\n  add n to seen\nreturn true"
      },
      "MiddleOfLinkedList": {
        "prompt": "Before reading: why does slow stop exactly at the middle?",
        "steps": [
          "Move fast two nodes for every one node slow moves.",
          "When fast cannot move further, it has consumed the list length.",
          "Slow has moved half as many steps, so it points at the middle."
        ],
        "skeleton": "slow = head; fast = head\nwhile fast != null and fast.next != null:\n  slow = slow.next\n  fast = fast.next.next\nreturn slow"
      },
      "PalindromicLinkedList": {
        "prompt": "Before reading: how do you compare a linked list from both ends without backward pointers?",
        "steps": [
          "Use slow and fast to find the middle.",
          "Reverse the second half so it can be walked forward.",
          "Compare head and reversed-half values one by one."
        ],
        "skeleton": "slow = middle using fast pointer\nright = reverse(slow)\nleft = head\nwhile right != null:\n  if left.val != right.val: return false\n  left = left.next\n  right = right.next\nreturn true"
      }
    };

    const definingMoves = {
      "LinkedListCycle": "fast moves two, slow moves one\ncycle means fast eventually catches slow",
      "LinkedListCycleII": "after collision, restart one pointer at head\nmove both one step to find the loop door",
      "HappyNumber": "each number points to its digit-square sum\nrepeat means cycle, 1 means happy",
      "MiddleOfLinkedList": "fast consumes two nodes per slow step\nwhen fast ends, slow is halfway",
      "PalindromicLinkedList": "find middle, reverse right half\ncompare left and reversed right"
    };

    const solvedOrder = [
      "LinkedListCycle",
      "LinkedListCycleII",
      "HappyNumber",
      "MiddleOfLinkedList",
      "PalindromicLinkedList"
    ];

    cards.sort((a, b) => solvedOrder.indexOf(a.name) - solvedOrder.indexOf(b.name));
    cards.forEach(card => Object.assign(card, recallDetails[card.name], {
      definingMove: definingMoves[card.name]
    }));
    cards.forEach((card, index) => {
      card.problemNo = index + 1;
      card.problemLabel = `#${String(index + 1).padStart(2, "0")}`;
    });

    const cardsEl = document.getElementById("cards");
    const searchEl = document.getElementById("search");
    const emptyEl = document.getElementById("empty");
    const quickModeEl = document.getElementById("quickMode");
    const totalCountEl = document.getElementById("totalCount");
    const incrementAllEl = document.getElementById("incrementAll");
    const resetAllEl = document.getElementById("resetAll");
    let quickMode = true;
    const expandedQuickCards = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function storageKey(cardName) {
      return `dsa-revision:fastslow:${cardName}`;
    }

    function readRevision(cardName) {
      try {
        const raw = localStorage.getItem(storageKey(cardName));
        if (!raw) return { count: 0, last: "" };
        const parsed = JSON.parse(raw);
        return {
          count: Number(parsed.count) || 0,
          last: typeof parsed.last === "string" ? parsed.last : ""
        };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(cardName, revision) {
      try {
        localStorage.setItem(storageKey(cardName), JSON.stringify(revision));
      } catch {
        // Keep the page usable even if browser storage is unavailable.
      }
    }

    function formatLastRevised(value) {
      if (!value) return "Last revised: never";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return `Last revised: ${value}`;
      return `Last revised: ${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
    }

    function todayLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderRevisionControls(card) {
      const revision = readRevision(card.name);
      return `
        <div class="revision-controls">
          <span class="revision-pill">Revised ${revision.count}x</span>
          <span class="revision-pill">${escapeHtml(formatLastRevised(revision.last))}</span>
          <button class="revision-button" type="button" data-action="increment" data-card="${escapeHtml(card.name)}">+1</button>
          <button class="revision-button reset" type="button" data-action="reset" data-card="${escapeHtml(card.name)}">Reset</button>
        </div>
      `;
    }

    function renderFullCard(card, extraClass = "") {
      const bruteForce = card.bruteForce || "Start with the simplest correct approach that directly follows the problem statement, then compare it with the optimized move above.";
      const alternates = card.alternates || ["No strong alternate approach needed for quick revision; focus on the core move."];
      return `
        <article class="card ${escapeHtml(card.difficulty.toLowerCase())} ${extraClass}">
          <div class="card-head">
            <div>
              <h2 class="problem-title"><span><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</span></h2>
              ${renderRevisionControls(card)}
              <div class="meta-line">
                <span>${escapeHtml(card.label)}</span>
                <span>${escapeHtml(card.difficulty)}</span>
                <a href="${escapeHtml(card.source)}">Source</a>
                ${card.leetcode ? `<a href="${escapeHtml(card.leetcode)}" target="_blank" rel="noreferrer">LeetCode</a>` : ""}
              </div>
            </div>
            <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
          </div>
          <div class="body">
            <div class="recall-prompt">${escapeHtml(card.prompt)}</div>
            <div class="description">
              <b>Problem description</b>
              ${escapeHtml(card.description)}
            </div>
            <div class="sample">
              <div class="sample-box">
                <b>Input</b>
                <code>${escapeHtml(card.input)}</code>
              </div>
              <div class="sample-box">
                <b>Output</b>
                <code>${escapeHtml(card.output)}</code>
              </div>
            </div>
            <div class="cost-strip">
              <div class="cost-item">
                <span class="cost-label">Time</span>
                <span class="cost-value">${escapeHtml(card.time)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Space</span>
                <span class="cost-value">${escapeHtml(card.space)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Data structures</span>
                <span class="cost-value">${escapeHtml(card.structures)}</span>
              </div>
            </div>
            <div class="section-grid">
              <div class="section">
                <b>When to recognize it</b>
                ${escapeHtml(card.recognize)}
              </div>
              <div class="section">
                <b>Visual hook</b>
                <div class="visual">${renderVisual(card.visual)}</div>
                ${renderSteps(card.steps)}
                <span class="hint">${escapeHtml(card.visualText)}</span>
              </div>
              <div class="section">
                <b>Core move</b>
                ${escapeHtml(card.core)}
              </div>
              <div class="section">
                <b>Code skeleton</b>
                <code>${escapeHtml(card.skeleton)}</code>
              </div>
              <div class="section brute-force">
                <b>Brute force / baseline</b>
                ${escapeHtml(bruteForce)}
              </div>
              <div class="section alternates">
                <b>Alternate approaches</b>
                <ul class="gotchas">${alternates.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
              <div class="section full">
                <b>Bug magnets</b>
                <ul class="gotchas">${card.gotchas.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderQuickReview(cardsToRender) {
      return `<div class="quick-review">${cardsToRender.map(card => {
        const expanded = expandedQuickCards.has(card.name);
        return `
          <div class="quick-item">
            <article class="quick-row ${escapeHtml(card.difficulty.toLowerCase())} ${expanded ? "expanded" : ""}" data-expand-card="${escapeHtml(card.name)}" role="button" tabindex="0" aria-expanded="${expanded}">
              <span class="expand-cue" aria-hidden="true">⌄</span>
              <div>
                <div class="quick-title">
                  <strong><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</strong>
                  <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
                </div>
                ${renderRevisionControls(card)}
                <div class="quick-summary">
                  <span class="quick-approach">${escapeHtml(card.label)}</span>
                  <div class="quick-facts">
                    <span class="quick-fact"><b>Time</b> ${escapeHtml(card.time)}</span>
                    <span class="quick-fact"><b>Space</b> ${escapeHtml(card.space)}</span>
                  </div>
                  <span class="quick-uses"><b>Uses</b> ${escapeHtml(card.structures)}</span>
                </div>
              </div>
              <div>
                <span class="quick-label">Recall prompt</span>
                <span class="quick-text">${escapeHtml(card.prompt)}</span>
              </div>
              <div>
                <span class="quick-label">Defining move</span>
                <code>${escapeHtml(card.definingMove)}</code>
              </div>
              <div>
                <span class="quick-label">Bug magnet</span>
                <span class="quick-text">${escapeHtml(card.gotchas[0])}</span>
              </div>
            </article>
            ${expanded ? renderFullCard(card, "quick-expanded-card") : ""}
          </div>
        `;
      }).join("")}</div>`;
    }

    function toggleQuickCard(cardName) {
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.problemLabel,
          card.label,
          card.difficulty,
          card.time,
          card.space,
          card.structures,
          card.leetcode,
          card.source,
          card.description,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.prompt,
          card.skeleton,
          card.steps.join(" "),
          card.gotchas.join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = renderQuickReview(visible);
        emptyEl.style.display = visible.length ? "none" : "block";
        return;
      }

      cardsEl.className = "cards";
      cardsEl.innerHTML = visible.map(card => renderFullCard(card)).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action][data-card]");
      if (button) {
        const cardName = button.dataset.card;
        if (button.dataset.action === "increment") {
          const current = readRevision(cardName);
          writeRevision(cardName, {
            count: current.count + 1,
            last: todayLocalDate()
          });
        }
        if (button.dataset.action === "reset") {
          writeRevision(cardName, { count: 0, last: "" });
        }
        render();
        return;
      }
      const quickRow = event.target.closest("[data-expand-card]");
      if (quickRow) toggleQuickCard(quickRow.dataset.expandCard);
    });
    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const quickRow = event.target.closest("[data-expand-card]");
      if (!quickRow || event.target.closest("button, a")) return;
      event.preventDefault();
      toggleQuickCard(quickRow.dataset.expandCard);
    });
    incrementAllEl.addEventListener("click", () => {
      const today = todayLocalDate();
      cards.forEach(card => {
        const current = readRevision(card.name);
        writeRevision(card.name, {
          count: current.count + 1,
          last: today
        });
      });
      render();
    });
    resetAllEl.addEventListener("click", () => {
      if (!window.confirm("Reset revision counts and dates for all fast & slow pointers problems?")) return;
      cards.forEach(card => writeRevision(card.name, { count: 0, last: "" }));
      render();
    });
    quickModeEl.addEventListener("click", () => {
      quickMode = !quickMode;
      quickModeEl.classList.toggle("active", quickMode);
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
      render();
    });
    totalCountEl.textContent = `${cards.length} problem${cards.length === 1 ? "" : "s"}`;
    render();
  </script>
</body>
</html>
