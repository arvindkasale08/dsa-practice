<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Pointers Revision</title>
  <style>
    :root {
      --ink: #18221e;
      --muted: #5e6d66;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --paper: #edf2ee;
      --panel: #fffefa;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      border-top: 4px solid var(--green);
    }

    a {
      color: var(--green);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--green-dark); }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    .back-link:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
      color: #13241d;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .subtitle {
      margin: 0 0 18px;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .card.easy { border-color: #bad9ca; border-top-color: var(--green); }
    .card.medium { border-color: #e6cf9b; border-top-color: var(--gold); }
    .card.hard { border-color: #e5c1bc; border-top-color: var(--red); }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #f8faf7;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #bad9ca;
      color: var(--green-dark);
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #213c30;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .section.brute-force {
      border-color: #e6cf9b;
      background: #fffdf6;
    }

    .section.alternates {
      border-color: #bfd3e1;
      background: #f7fbff;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    .quick-review {
      display: grid;
      gap: 8px;
    }

    .quick-item {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) minmax(180px, .85fr) minmax(220px, 1.2fr) minmax(220px, 1.2fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
    }

    .quick-row.easy { border-color: #bad9ca; border-left-color: var(--green); }
    .quick-row.medium { border-color: #e6cf9b; border-left-color: var(--gold); }
    .quick-row.hard { border-color: #e5c1bc; border-left-color: var(--red); }

    .quick-row:hover,
    .quick-row:focus-visible,
    .quick-row.expanded {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
    }

    .quick-title .difficulty {
      min-height: 22px;
      padding: 2px 8px;
    }

    .quick-summary {
      display: grid;
      gap: 5px;
      margin-top: 6px;
    }

    .quick-approach {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--blue);
      background: #eef6fa;
      padding: 3px 7px;
      color: #294a5e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .quick-fact {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7faf8;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-fact b,
    .quick-uses b {
      color: #3c4d43;
      font-size: 10px;
      text-transform: uppercase;
    }

    .quick-uses {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-label {
      color: #3c4d43;
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .tools { justify-content: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .section.full { grid-column: auto; }
      .card-head { grid-template-columns: 1fr; }
      .tools { display: grid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../../">Back to index</a>
    <header>
      <div>
        <div class="title-row">
          <h1>Two Pointers Revision</h1>
          <span id="totalCount" class="count-pill"></span>
          <div class="page-revision-controls">
            <button id="incrementAll" class="revision-button" type="button">+1 All</button>
            <button id="resetAll" class="revision-button reset" type="button">Reset All</button>
          </div>
        </div>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Search two pointers cards">
        <button id="quickMode" class="mode-button active" type="button">Card Review</button>
      </div>
    </header>
    <p class="subtitle">Fast recall cards for the current two pointers package. Read the problem name, picture the pointer movement, then check the sample and bug magnets before opening the Java file.</p>

    <section id="cards" class="cards"></section>
    <div id="empty" class="empty">No matching two pointers cards.</div>
  </main>

  <script>
    const cards = [
      {
        "name": "CellsWithOddValues",
        "source": "../com/arvind/revision/twopointers/CellsWithOddValues.java",
        "label": "Row/column parity",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/cells-with-odd-values-in-a-matrix/",
        "description": "Start with a zero matrix. For every index pair, increment its whole row and whole column, then count cells whose final value is odd.",
        "time": "O(k + m * n)",
        "space": "O(m + n)",
        "structures": "Row parity array, column parity array",
        "input": "m = 2, n = 3\nindices = [[0,1], [1,1]]",
        "output": "6",
        "recognize": "When full rows and columns receive repeated updates, but you only care whether each final value is odd or even.",
        "visual": [
          [
            "r0:+1",
            "r1:+1"
          ],
          [
            "c0:0",
            "c1:+2",
            "c2:0"
          ]
        ],
        "visualText": "Track row and column parity instead of touching the whole matrix after every operation. A cell is odd when its row parity and column parity differ.",
        "core": "Toggle or count the affected row and column for every operation. At the end, combine each row state with each column state and count odd cells.",
        "gotchas": [
          "The current Java method is incomplete and always returns 0.",
          "You do not need to build and repeatedly update the full matrix."
        ]
      },
      {
        "name": "PairWithTargetSum",
        "source": "../com/arvind/revision/twopointers/PairWithTargetSum.java",
        "label": "Opposite-end sum",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/",
        "description": "Given a sorted array and a target, return the indices of two numbers whose sum equals the target.",
        "time": "O(n)",
        "space": "O(1)",
        "structures": "Left and right pointers",
        "input": "arr = [1, 2, 3, 4, 6]\ntarget = 6",
        "output": "[1, 3]",
        "recognize": "When a sorted array asks for a pair with an exact sum and moving one endpoint changes the sum predictably.",
        "visual": [
          [
            "1",
            "2",
            "3",
            "4",
            "6"
          ],
          [
            "L ->",
            "",
            "",
            "<- R"
          ]
        ],
        "visualText": "The smallest and largest values face each other. Too large means shrink from the right; too small means grow from the left.",
        "core": "Start at both ends. Compare arr[left] + arr[right] with the target, then move exactly the pointer that can correct the sum.",
        "gotchas": [
          "This two-pointer direction relies on the array being sorted.",
          "Return the index format expected by the caller; LeetCode Two Sum II expects one-based indexes."
        ]
      },
      {
        "name": "RemoveDuplicates",
        "source": "../com/arvind/revision/twopointers/RemoveDuplicates.java",
        "label": "Unique write slot",
        "difficulty": "Easy",
        "leetcode": "https://leetcode.com/problems/remove-duplicates-from-sorted-array/",
        "description": "Remove duplicates from a sorted array in place and return how many unique values remain at the front.",
        "time": "O(n)",
        "space": "O(1)",
        "structures": "Read pointer, last-unique pointer",
        "input": "arr = [2, 3, 3, 3, 6, 9, 9]",
        "output": "4\nfront = [2, 3, 6, 9]",
        "recognize": "When a sorted array must be compacted in place while preserving one copy of every distinct value.",
        "visual": [
          [
            "2",
            "3",
            "3",
            "3",
            "6",
            "9",
            "9"
          ],
          [
            "2",
            "3",
            "6",
            "9",
            "_",
            "_",
            "_"
          ]
        ],
        "visualText": "The read pointer explores; the write boundary advances only when a genuinely new value appears.",
        "core": "Keep the last unique value at the write boundary. Scan forward and copy a value only when it differs from the last unique value.",
        "gotchas": [
          "The current implementation returns 1 for an empty array; guard empty input first.",
          "The values after the returned unique length do not matter."
        ]
      },
      {

        "difficulty": "Medium",
        "leetcode": "https://leetcode.com/problems/rearrange-array-elements-by-sign/",
        "description": "Given an array with equal counts of positive and negative numbers, rearrange it so positives and negatives alternate, starting with a positive, while preserving relative order within each sign group.",
        "time": "O(n)",
        "space": "O(n)",
        "structures": "Output array, positive scan pointer, negative scan pointer",
        "input": "nums = [3, 1, -2, -5, 2, -4]",

        "recognize": "When the target positions are fixed by sign: even indexes need positives and odd indexes need negatives.",

            "3:-",
            "4:+",
            "5:-"

          [
            "pos scan",
            "neg scan"
          ],
          [
            "write positive",
            "write negative",
            "jump +2"
          ]
        ],
        "visualText": "Think of the result as alternating slots. Fill each even slot with the next positive and the following odd slot with the next negative.",
        "core": "Keep one pointer searching for the next positive and one pointer searching for the next negative. Write them into result positions i and i+1, then move i by two.",
        "bruteForce": "Build two separate lists, one for positives and one for negatives, then merge them alternately. It is clear but still uses O(n) extra space.",
        "alternates": [

    const recallDetails = {
      "CellsWithOddValues": {
        "prompt": "Before reading: can row and column parity replace repeated full-matrix updates?",
        "steps": [
          "Toggle the chosen row state.",
          "Toggle the chosen column state.",
          "A cell is odd when row and column parity differ."
        ],
        "skeleton": "rows = int[m]; cols = int[n]\nfor [r,c] in indices: rows[r]++; cols[c]++\nodd = 0\nfor r, c:\n  if (rows[r] + cols[c]) % 2 == 1: odd++"
      },
      "PairWithTargetSum": {
        "prompt": "Before reading: which pointer move makes the current sum closer to target?",
        "steps": [
          "Start at the smallest and largest values.",
          "Too small: move left rightward.",
          "Too large: move right leftward."
        ],
        "skeleton": "left = 0; right = n - 1\nwhile left < right:\n  sum = arr[left] + arr[right]\n  if sum == target: return [left, right]\n  if sum < target: left++\n  else: right--"
      },
      "RemoveDuplicates": {
        "prompt": "Before reading: where should the next distinct value be written?",
        "steps": [
          "Keep the latest unique value at the write boundary.",
          "Scan each sorted value.",
          "Copy only when the value changes."
        ],
        "skeleton": "if arr.length == 0: return 0\nwrite = 1\nfor read from 1:\n  if arr[read] != arr[write-1]:\n    arr[write++] = arr[read]\nreturn write"
      },
      "SquaringSortedArray": {
        "prompt": "Before reading: why must the next largest square come from an endpoint?",
        "steps": [
          "Compare absolute values at both ends.",
          "Write the larger square into the last open slot.",
          "Move that endpoint inward."
        ],
        "skeleton": "left = 0; right = n - 1; write = n - 1\nwhile left <= right:\n  if abs(arr[left]) >= abs(arr[right]): use left++\n  else: use right--\n  squares[write--] = chosen * chosen"
      },
      "ThreeSum": {
        "prompt": "Before reading: how do you prevent the same triplet from being emitted twice?",
        "steps": [
          "Sort and choose one anchor.",
          "Use left/right to find the balancing pair.",
          "Skip duplicate anchors and duplicate pair values."
        ],
        "skeleton": "sort(arr)\nfor i:\n  if i > 0 && arr[i] == arr[i-1]: continue\n  left = i+1; right = n-1\n  while left < right:\n    move by sum; record zero and skip duplicates"
      },
      "ThreeSumClosest": {
        "prompt": "Before reading: when must the closest-so-far answer be updated?",
        "steps": [
          "Sort and fix an anchor.",
          "Measure every current triplet's distance to target.",
          "Update best before moving toward target."
        ],
        "skeleton": "sort(arr); best = first triplet sum\nfor i:\n  left = i+1; right = n-1\n  while left < right:\n    sum = arr[i]+arr[left]+arr[right]\n    update best by abs(target-sum)\n    if sum < target: left++ else: right--"
      },
      "ThreeSumSmaller": {
        "prompt": "Before reading: why does one valid sum prove right-left triplets are valid?",
        "steps": [
          "Sort and fix an anchor.",
          "Test the largest pair at left/right.",
          "If valid, count the entire right-left range."
        ],
        "skeleton": "sort(arr); count = 0\nfor i:\n  left = i+1; right = n-1\n  while left < right:\n    if sum < target: count += right-left; left++\n    else: right--"
      },
      "DutchNationalFlagProblem": {
        "prompt": "Before reading: which swapped-in value must be examined again?",
        "steps": [
          "Zero goes to the low boundary.",
          "One stays and scan advances.",
          "Two goes to high; re-check the new scan value."
        ],
        "skeleton": "low = 0; scan = 0; high = n - 1\nwhile scan <= high:\n  if arr[scan] == 0: swap(low++, scan++)\n  else if arr[scan] == 1: scan++\n  else: swap(scan, high--)"
      },
      "BackspaceStringCompare": {
        "prompt": "Before reading: what does a # mean when scanning from right to left?",
        "steps": [
          "Move each pointer left until it lands on a live character.",
          "A # increases skip count; a normal character is skipped if skip count is positive.",
          "Compare the two live characters, then continue left."
        ],
        "skeleton": "i = s.length - 1; j = t.length - 1\nwhile i >= 0 or j >= 0:\n  i = nextLiveIndex(s, i)\n  j = nextLiveIndex(t, j)\n  if i < 0 or j < 0: return i == j\n  if s[i] != t[j]: return false\n  i--; j--\nreturn true"
      },
      "ValidPalindromeII": {
        "prompt": "Before reading: where do you spend the only deletion token?",
        "steps": [
          "Move left and right inward while characters match.",
          "At the first mismatch, try skipping the left character.",
          "Also try skipping the right character; either successful inner check is enough."
        ],
        "skeleton": "left = 0; right = n - 1\nwhile left < right:\n  if s[left] == s[right]: left++; right--\n  else:\n    return isPalindrome(left + 1, right)\n        || isPalindrome(left, right - 1)\nreturn true"
      },
      "ShortestUnsortedContinuousSubarray": {
        "prompt": "Before reading: which scan gives the right boundary, and which scan gives the left boundary?",
        "steps": [
          "From the left, track maxSoFar; smaller values prove the right edge must extend there.",
          "From the right, track minSoFar; larger values prove the left edge must extend there.",
          "The answer is right-left+1, or 0 if no boundary moved."
        ],
        "skeleton": "right = 0; maxSoFar = nums[0]\nfor i from 1 to n-1:\n  if nums[i] < maxSoFar: right = i\n  maxSoFar = max(maxSoFar, nums[i])\nleft = 0; minSoFar = nums[n-1]\nfor i from n-2 down to 0:\n  if nums[i] > minSoFar: left = i\n  minSoFar = min(minSoFar, nums[i])\nreturn no violation ? 0 : right - left + 1"
      },
      "ContainerWithMostWater": {
        "prompt": "Before reading: why is the shorter wall the only pointer worth moving?",
        "steps": [
          "Compute area from the current left and right walls.",
          "The shorter wall limits the water height.",
          "Move the shorter wall inward to search for a taller cap before width shrinks too much."
        ],
        "skeleton": "left = 0; right = n - 1; best = 0\nwhile left < right:\n  area = min(height[left], height[right]) * (right - left)\n  best = max(best, area)\n  if height[left] <= height[right]: left++\n  else: right--\nreturn best"
      },
      "BoatsToSavePeople": {
        "prompt": "Before reading: why does the heaviest remaining person get decided immediately?",
        "steps": [
          "Sort people so the lightest and heaviest remaining are visible.",
          "The heaviest must use a boat now; check if the lightest can share it.",
          "Count one boat every loop, and move the heavy pointer every loop."
        ],
        "skeleton": "sort(people)\nleft = 0; right = n - 1; boats = 0\nwhile left <= right:\n  if people[left] + people[right] <= limit:\n    left++\n  right--\n  boats++\nreturn boats"
      },
      "SortArrayByParity": {
        "prompt": "Before reading: what exact pair deserves a swap?",
        "steps": [
          "Left pointer wants an even value.",
          "Right pointer wants an odd value.",
          "Swap only when left is odd and right is even; otherwise move the already-correct side."
        ],
        "skeleton": "left = 0; right = n - 1\nwhile left < right:\n  if nums[left] is odd and nums[right] is even:\n    swap(left, right); left++; right--\n  else:\n    if nums[left] is even: left++\n    if nums[right] is odd: right--\nreturn nums"
      },
      "RemoveDuplicatesFromSortedArray": {
        "prompt": "Before reading: where does the next new value get written?",
        "steps": [
          "Keep l on the last unique value already placed.",
          "Move r until it finds a value different from nums[l].",
          "Copy nums[r] to l+1, then advance the unique boundary."
        ],
        "skeleton": "l = 0; r = 1\nwhile r < n:\n  while r < n and nums[r] == nums[l]: r++\n  if r == n: break\n  nums[l + 1] = nums[r]\n  l++; r++\nreturn l + 1"
      },
      "TwoSumSorted": {
        "prompt": "Before reading: which pointer move makes the current sum move toward target?",
        "steps": [
          "Left and right start at the smallest and largest remaining values.",
          "If the sum is too small, increase it by moving left rightward.",
          "If the sum is too large, decrease it by moving right leftward."
        ],
        "skeleton": "left = 0; right = n - 1\nwhile left < right:\n  sum = numbers[left] + numbers[right]\n  if sum == target: return [left + 1, right + 1]\n  if sum < target: left++\n  else: right--"
      },
      "FindDuplicateNumber": {
        "prompt": "Before reading: why can an array of values behave like a linked-list cycle?",
        "steps": [
          "Treat nums[i] as the next index to jump to.",
          "Use slow and fast jumps until they meet inside the loop.",
          "Reset one pointer to 0; the second meeting is the loop entry and duplicate."
        ],
        "skeleton": "slow = 0; fast = 0\nrepeat:\n  slow = nums[slow]\n  fast = nums[nums[fast]]\nuntil slow == fast\nslow = 0\nwhile slow != fast:\n  slow = nums[slow]\n  fast = nums[fast]\nreturn slow"
      },
      "MaximumProductOfTwoElementsInArray": {
        "prompt": "Before reading: what happens to the old max when a new max appears?",
        "steps": [
          "Keep max1 as the largest value seen.",
          "Keep max2 as the second largest value seen.",
          "When current becomes max1, demote old max1 into max2 before replacing it."
        ],
        "skeleton": "max1 = -inf; max2 = -inf\nfor value in nums:\n  if value >= max1:\n    max2 = max1\n    max1 = value\n  else if value >= max2:\n    max2 = value\nreturn (max1 - 1) * (max2 - 1)"
      },
      "RearrangeBySign": {
        "prompt": "Before reading: which slots are reserved for positives and negatives?",
        "steps": [
          "Even output positions get the next positive number.",
          "Odd output positions get the next negative number.",
          "Move both source scanners forward only after their next matching value is used."
        ],
        "skeleton": "result = int[n]\npos = 0; neg = 0\nfor i = 0; i < n; i += 2:\n  move pos to next positive\n  move neg to next negative\n  result[i] = nums[pos]\n  result[i + 1] = nums[neg]\n  pos++; neg++\nreturn result"
      }
    };

    const definingMoves = {
      "CellsWithOddValues": "cell is odd when rowParity[r] != colParity[c]",
      "PairWithTargetSum": "sum too small → left++\nsum too large → right--",
      "RemoveDuplicates": "if arr[read] != arr[write - 1]:\n  arr[write++] = arr[read]",
      "SquaringSortedArray": "write larger end-square at output[write--]",
      "ThreeSum": "fix anchor, then two-sum with left/right",
      "ThreeSumClosest": "update best by |target - sum|\nmove pointer by sum direction",
      "ThreeSumSmaller": "if sum < target:\n  count += right - left",
      "DutchNationalFlagProblem": "0 → swap low\n1 → advance\n2 → swap high",
      "BackspaceStringCompare": "# creates skip tickets\nreverse pointers reveal next live character",
      "ValidPalindromeII": "first mismatch spends the only deletion:\nskip left OR skip right",
      "ShortestUnsortedContinuousSubarray": "left scan moves right boundary\nright scan moves left boundary",
      "ContainerWithMostWater": "area is capped by shorter wall\nmove the shorter pointer",
      "BoatsToSavePeople": "heaviest boards every loop\nlightest joins only if it fits",
      "SortArrayByParity": "swap only wrong-left odd\nwith wrong-right even",
      "RemoveDuplicatesFromSortedArray": "r finds next unique\nwrite it at l + 1",
      "TwoSumSorted": "sum too small -> left++\nsum too large -> right--",
      "FindDuplicateNumber": "values are next-index arrows\nduplicate is cycle entry",

      "BoatsToSavePeople",

    cards.sort((a, b) => solvedOrder.indexOf(a.name) - solvedOrder.indexOf(b.name));

    let quickMode = true;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function storageKey(cardName) {
      return `dsa-revision:twopointers:${cardName}`;
    }

    function readRevision(cardName) {
      try {
        const raw = localStorage.getItem(storageKey(cardName));
        if (!raw) return { count: 0, last: "" };
        const parsed = JSON.parse(raw);
        return {
          count: Number(parsed.count) || 0,
          last: typeof parsed.last === "string" ? parsed.last : ""
        };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(cardName, revision) {
      try {
        localStorage.setItem(storageKey(cardName), JSON.stringify(revision));
      } catch {
        // Keep the page usable even if browser storage is unavailable.
      }
    }

    function formatLastRevised(value) {
      if (!value) return "Last revised: never";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return `Last revised: ${value}`;
      return `Last revised: ${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
    }

    function todayLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderRevisionControls(card) {
      const revision = readRevision(card.name);
      return `
        <div class="revision-controls">
          <span class="revision-pill">Revised ${revision.count}x</span>
          <span class="revision-pill">${escapeHtml(formatLastRevised(revision.last))}</span>
          <button class="revision-button" type="button" data-action="increment" data-card="${escapeHtml(card.name)}">+1</button>
          <button class="revision-button reset" type="button" data-action="reset" data-card="${escapeHtml(card.name)}">Reset</button>
        </div>
      `;
    }

    function renderFullCard(card, extraClass = "") {
      const bruteForce = card.bruteForce || "Start with the simplest correct approach that directly follows the problem statement, then compare it with the optimized move above.";
      const alternates = card.alternates || ["No strong alternate approach needed for quick revision; focus on the core move."];
      return `
        <article class="card ${escapeHtml(card.difficulty.toLowerCase())} ${extraClass}">
          <div class="card-head">
            <div>
              <h2 class="problem-title"><span><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</span></h2>
              ${renderRevisionControls(card)}
              <div class="meta-line">
                <span>${escapeHtml(card.label)}</span>
                <span>${escapeHtml(card.difficulty)}</span>
                <a href="${escapeHtml(card.source)}">Source</a>
                ${card.leetcode ? `<a href="${escapeHtml(card.leetcode)}" target="_blank" rel="noreferrer">LeetCode</a>` : ""}
              </div>
            </div>
            <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
          </div>
          <div class="body">
            <div class="recall-prompt">${escapeHtml(card.prompt)}</div>
            <div class="description">
              <b>Problem description</b>
              ${escapeHtml(card.description)}
            </div>
            <div class="sample">
              <div class="sample-box">
                <b>Input</b>
                <code>${escapeHtml(card.input)}</code>
              </div>
              <div class="sample-box">
                <b>Output</b>
                <code>${escapeHtml(card.output)}</code>
              </div>
            </div>
            <div class="cost-strip">
              <div class="cost-item">

                <span class="cost-value">${escapeHtml(card.time)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Space</span>
                <span class="cost-value">${escapeHtml(card.space)}</span>
              </div>
              <div class="cost-item">
                <span class="cost-label">Data structures</span>
                <span class="cost-value">${escapeHtml(card.structures)}</span>
              </div>
            </div>
            <div class="section-grid">
              <div class="section">
                <b>When to recognize it</b>
                ${escapeHtml(card.recognize)}
              </div>
              <div class="section">
                <b>Visual hook</b>
                <div class="visual">${renderVisual(card.visual)}</div>
                ${renderSteps(card.steps)}
                <span class="hint">${escapeHtml(card.visualText)}</span>
              </div>
              <div class="section">
                <b>Core move</b>
                ${escapeHtml(card.core)}
              </div>
              <div class="section">
                <b>Code skeleton</b>
                <code>${escapeHtml(card.skeleton)}</code>

    function renderQuickReview(cardsToRender) {
      return `<div class="quick-review">${cardsToRender.map(card => {

                  <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
                </div>
                ${renderRevisionControls(card)}
                <div class="quick-summary">
                  <span class="quick-approach">${escapeHtml(card.label)}</span>
                  <div class="quick-facts">

                    <span class="quick-fact"><b>Space</b> ${escapeHtml(card.space)}</span>
                  </div>
                  <span class="quick-uses"><b>Uses</b> ${escapeHtml(card.structures)}</span>
                </div>
              </div>
              <div>
                <span class="quick-label">Recall prompt</span>

    function toggleQuickCard(cardName) {
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.problemLabel,
          card.label,
          card.difficulty,
          card.time,
          card.space,
          card.structures,
          card.leetcode,
          card.source,
          card.description,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.prompt,
          card.skeleton,
          card.steps.join(" "),
          card.gotchas.join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = renderQuickReview(visible);
        emptyEl.style.display = visible.length ? "none" : "block";
        return;
      }

      cardsEl.className = "cards";
      cardsEl.innerHTML = visible.map(card => renderFullCard(card)).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action][data-card]");
      if (button) {
        const cardName = button.dataset.card;
        if (button.dataset.action === "increment") {
          const current = readRevision(cardName);
          writeRevision(cardName, {
            count: current.count + 1,
            last: todayLocalDate()
          });
        }
        if (button.dataset.action === "reset") {
          writeRevision(cardName, { count: 0, last: "" });
        }
        render();
        return;
      }
      const quickRow = event.target.closest("[data-expand-card]");
      if (quickRow) toggleQuickCard(quickRow.dataset.expandCard);
    });
    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const quickRow = event.target.closest("[data-expand-card]");
      if (!quickRow || event.target.closest("button, a")) return;
      event.preventDefault();
      toggleQuickCard(quickRow.dataset.expandCard);
    });
    incrementAllEl.addEventListener("click", () => {
      const today = todayLocalDate();
      cards.forEach(card => {
        const current = readRevision(card.name);
        writeRevision(card.name, {
          count: current.count + 1,
          last: today
        });
      });
      render();
    });
    resetAllEl.addEventListener("click", () => {
      if (!window.confirm("Reset revision counts and dates for all two pointers problems?")) return;
      cards.forEach(card => writeRevision(card.name, { count: 0, last: "" }));
      render();
    });
    quickModeEl.addEventListener("click", () => {
      quickMode = !quickMode;
      quickModeEl.classList.toggle("active", quickMode);
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
      render();
    });
    totalCountEl.textContent = `${cards.length} problem${cards.length === 1 ? "" : "s"}`;
    render();
  </script>
</body>
</html>
