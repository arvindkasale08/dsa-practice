<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Programming Revision</title>
  <style>
    :root {
      --ink: #18221e;
      --muted: #5e6d66;
      --line: #d4ddd7;
      --line-strong: #b9c9bf;
      --paper: #edf2ee;
      --panel: #fffefa;
      --green: #176b51;
      --green-dark: #0f4f3c;
      --green-soft: #e1f2e9;
      --blue: #326c94;
      --blue-soft: #e4f0f7;
      --gold: #a96b16;
      --gold-soft: #fbefd5;
      --red: #a4473e;
      --red-soft: #f8e7e4;
      --shadow: 0 12px 30px rgba(31, 53, 42, .08);
      --shadow-hover: 0 18px 38px rgba(31, 53, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      border-top: 4px solid var(--green);
    }

    a {
      color: var(--green);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--green-dark); }

    button,
    input {
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(50, 108, 148, .22);
      outline-offset: 2px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    header {
      position: sticky;
      top: 52px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(185, 201, 191, .8);
      border-radius: 8px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 8px 24px rgba(31, 53, 42, .08);
      backdrop-filter: blur(12px);
    }

    .back-link {
      position: sticky;
      top: 8px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(31, 53, 42, .1);
    }

    .back-link:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
      color: #13241d;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .page-revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .subtitle {
      margin: 0 0 18px;
      max-width: 840px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(380px, 100%);
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(50, 108, 148, .12);
    }

    .mode-button {
      height: 42px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--green);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
    }

    .mode-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .pdf-button {
      height: 42px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--panel);
      color: var(--blue);
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .pdf-button:hover {
      background: rgba(50, 108, 148, .12);
      transform: translateY(-1px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .card.easy { border-color: #bad9ca; border-top-color: var(--green); }
    .card.medium { border-color: #e6cf9b; border-top-color: var(--gold); }
    .card.hard { border-color: #e5c1bc; border-top-color: var(--red); }

    .card.theory {
      background: #efe7ff;
      border-color: #8f70d7;
      border-top-color: #4f2f9f;
      box-shadow: 0 14px 30px rgba(79, 47, 159, .18);
    }

    .cards .card.theory {
      grid-column: 1 / -1;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-head {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      background: #f8faf7;
    }

    .card.theory .card-head,
    .card.theory .body {
      background: #f4eeff;
    }

    .card.theory .card-head {
      border-bottom-color: #b79ee8;
    }

    .reference-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .reference-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border: 1px solid #b79ee8;
      border-radius: 8px;
      background: #ffffff;
      color: #3f1f8f;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
    }

    .reference-link:hover {
      background: #eadfff;
    }

    .reference-preview {
      display: block;
      width: min(100%, 760px);
      max-height: 460px;
      object-fit: contain;
      object-position: top left;
      border: 1px solid #b79ee8;
      border-radius: 8px;
      background: white;
      margin-top: 12px;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .problem-no {
      color: var(--green);
      font-weight: 900;
    }

    .card.theory .problem-no,
    .quick-row.theory .problem-no,
    .quick-row.theory .expand-cue {
      color: #3f1f8f;
    }

    .problem-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .revision-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
    }

    .revision-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .revision-button {
      min-height: 26px;
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 3px 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .revision-button:hover {
      border-color: var(--green);
      background: var(--green);
      color: white;
      transform: translateY(-1px);
    }

    .revision-button.reset {
      border-color: var(--line);
      background: #f6f8f5;
      color: var(--muted);
    }

    .revision-button.reset:hover {
      border-color: #dfb7b2;
      background: var(--red-soft);
      color: var(--red);
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-line a {
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      align-items: start;
    }

    .badge,
    .difficulty,
    .leetcode {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 10px;
      background: var(--green-soft);
      color: #28593f;
      border: 1px solid #cfe0d2;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .difficulty.easy {
      background: var(--green-soft);
      border-color: #bad9ca;
      color: var(--green-dark);
    }

    .difficulty.medium {
      background: var(--gold-soft);
      border-color: #edd89d;
      color: #67480b;
    }

    .difficulty.hard {
      background: var(--red-soft);
      border-color: #edc5bd;
      color: #773229;
    }

    .difficulty.theory {
      background: #eadfff;
      border-color: #b79ee8;
      color: #3f1f8f;
    }

    .leetcode {
      background: var(--blue-soft);
      border-color: #cddfeb;
      color: #2f536c;
      text-decoration: none;
    }

    .body {
      padding: 15px 16px 16px;
      display: grid;
      gap: 12px;
      background: var(--panel);
    }

    .recall-prompt {
      border: 1px solid #bad9ca;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .description {
      border: 1px solid #cddfeb;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-soft);
      color: #2f536c;
      padding: 10px;
      font-size: 14px;
      line-height: 1.42;
    }

    .description b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #2f536c;
    }

    .cost-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .cost-item {
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: #f8faf7;
      padding: 9px 10px;
      min-width: 0;
    }

    .cost-item:nth-child(2) { border-top-color: var(--blue); }
    .cost-item:nth-child(3) { border-top-color: var(--gold); }

    .cost-label {
      display: block;
      margin-bottom: 3px;
      color: #3c4d43;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .cost-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sample {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sample-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f9f7;
      padding: 10px;
    }

    .sample-box b,
    .section b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #3c4d43;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: #213c30;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      padding: 10px;
      min-height: 92px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .section.full {
      grid-column: 1 / -1;
      border-color: #e5c9c5;
      background: #fffaf8;
    }

    .section.brute-force {
      border-color: #e6cf9b;
      background: #fffdf6;
    }

    .section.alternates {
      border-color: #bfd3e1;
      background: #f7fbff;
    }

    .section.variant-lens {
      border-color: #e6cf9b;
      border-left: 4px solid var(--gold);
      background: #fff8e8;
      color: #60430d;
      font-weight: 700;
    }

    .dp-stages {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .dp-stage {
      min-height: auto;
      border-color: #bfd3e1;
      border-top: 4px solid var(--blue);
      background: #f7fbff;
    }

    .dp-stage-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .dp-stage-head b {
      margin: 0;
    }

    .dp-status {
      border: 1px solid #bad9ca;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .dp-status.card-supplied {
      border-color: #e6cf9b;
      background: var(--gold-soft);
      color: #67480b;
    }

    .dp-fact {
      display: block;
      margin: 5px 0;
    }

    .dp-fact strong {
      color: #3c4d43;
    }

    .theory-layout {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 10px;
    }

    .theory-layout .section {
      min-height: auto;
    }

    .theory-hero,
    .theory-wide {
      grid-column: 1 / -1;
    }

    .theory-hero {
      border-color: #9d85db;
      background: #fff;
      color: #30224f;
      font-size: 15px;
    }

    .theory-map {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .theory-map-item {
      border: 1px solid #d8c9ff;
      border-radius: 8px;
      background: #fbf8ff;
      padding: 9px;
      color: #3d315a;
      font-weight: 750;
      line-height: 1.35;
    }

    .theory-map-item span {
      display: block;
      margin-top: 4px;
      color: #695b80;
      font-weight: 650;
      font-size: 12px;
    }

    .visual {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .steps {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .step {
      display: flex;
      gap: 7px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--blue-soft);
      color: #2f536c;
      font-weight: 900;
      font-size: 11px;
    }

    .array {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .cell {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .cell.green { background: var(--green-soft); }
    .cell.blue { background: var(--blue-soft); }
    .cell.gold { background: var(--gold-soft); }
    .cell.red { background: var(--red-soft); }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .gotchas {
      margin: 0;
      padding-left: 18px;
    }

    .gotchas li {
      margin-bottom: 5px;
    }

    .gotchas li:last-child { margin-bottom: 0; }

    .empty {
      display: none;
      border: 1px dashed #b9c4bb;
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: white;
    }

    .quick-review {
      display: grid;
      gap: 8px;
    }

    .quick-item {
      display: grid;
      gap: 8px;
    }

    .quick-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) minmax(180px, .85fr) minmax(220px, 1.2fr) minmax(220px, 1.2fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px 40px 11px 11px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(31, 53, 42, .05);
    }

    .quick-row.easy { border-color: #bad9ca; border-left-color: var(--green); }
    .quick-row.medium { border-color: #e6cf9b; border-left-color: var(--gold); }
    .quick-row.hard { border-color: #e5c1bc; border-left-color: var(--red); }

    .quick-row.theory {
      background: #efe7ff;
      border-color: #8f70d7;
      border-left-color: #4f2f9f;
      box-shadow: 0 8px 18px rgba(79, 47, 159, .18);
    }

    .quick-row:hover,
    .quick-row:focus-visible,
    .quick-row.expanded {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .quick-row.theory:hover,
    .quick-row.theory:focus-visible,
    .quick-row.theory.expanded {
      background: #e6dcff;
    }

    .expand-cue {
      position: absolute;
      top: 12px;
      right: 13px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform .15s ease;
    }

    .quick-row.expanded .expand-cue {
      transform: rotate(180deg);
    }

    .quick-expanded-card {
      box-shadow: 0 12px 28px rgba(26, 37, 31, .08);
    }

    .quick-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .quick-row strong {
      display: block;
      font-size: 15px;
    }

    .quick-title .difficulty {
      min-height: 22px;
      padding: 2px 8px;
    }

    .quick-summary {
      display: grid;
      gap: 5px;
      margin-top: 6px;
    }

    .quick-approach {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--blue);
      background: #eef6fa;
      padding: 3px 7px;
      color: #294a5e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .quick-variant {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      border-left: 3px solid var(--gold);
      background: #fff5dc;
      padding: 3px 7px;
      color: #76510d;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .quick-fact {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7faf8;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-fact b,
    .quick-uses b {
      color: #3c4d43;
      font-size: 10px;
      text-transform: uppercase;
    }

    .quick-uses {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quick-label {
      color: #3c4d43;
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .quick-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .tools { justify-content: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .sample,
      .cost-strip,

                  "Use the current stair as the recursive state.",
                  "Pay fee[i] once, then try jumps of one, two, and three.",
                  "Reaching or crossing the array end adds no further fee.",
                  "Cache by i or propagate each paid cost forward to dp[n]."
            ],
            "skeleton": "minFee(i) = fee[i] + min(next 1, next 2, next 3)\nbase: i >= n → 0\nmemoize i, or relax forward until dp[n]"
      },
      "PaintHouse": {
            "prompt": "Before reading: why must the previous color be part of the state, and which colors may transition next?",
            "steps": [
                  "Carry the house index and previous color.",
                  "Try all three colors except the previous one.",
                  "Add the current painting cost before taking the minimum.",
                  "Cache the two-dimensional state; tabulation stores totals ending in each color."
            ],
            "skeleton": "solve(i,last) = min over color != last of\n  costs[i][color] + solve(i+1,color)\nbase: i == n → 0\ncache (i,last), or fill three colors per row"
      },
      "UniquePaths": {
            "prompt": "Before reading: which two neighboring states contribute paths to an interior cell?",
            "steps": [
                  "Use row and column as the state.",
                  "Recursion branches down and right.",
                  "Memoize each cell to remove repeated suffix grids.",
                  "Tabulation fills each cell from above plus left."
            ],
            "skeleton": "paths(i,j) = paths(i+1,j) + paths(i,j+1)\nreverse for table: dp[i][j] = above + left\nseed first row and first column with 1"
      },
      "UniquePathsII": {
            "prompt": "Before reading: what value should an obstacle contribute, and how does that affect cells after it?",
            "steps": [
                  "Use row and column as the state.",
                  "Return or store zero whenever the current cell is blocked.",
                  "For an open cell, combine the two legal neighboring states.",
                  "Seed boundaries from reachability instead of assuming every boundary cell has one path."
            ],
            "skeleton": "if blocked: ways = 0\nelse ways(i,j) = ways(i+1,j) + ways(i,j+1)\ntable view: obstacle ? 0 : above + left"
      },
      "MinimumPathSum": {
            "prompt": "Before reading: what must minCost(i,j) return so that (i,j) alone is a valid memo key?",
            "steps": [
                  "Define the memoized state as the minimum suffix cost from (i,j).",
                  "Return a large sentinel for an invalid branch.",
                  "At the destination, return that cell's cost.",
                  "Add the current cost to the minimum of down and right."
            ],
            "skeleton": "cost(i,j) = grid[i][j] + min(cost(i+1,j), cost(i,j+1))\ndestination = its cell cost\noutside = INF"
      },
      "Triangle": {
            "prompt": "Before reading: which two cells can follow (row,col), and what should the memo state return?",
            "steps": [
                  "Use row and column as the state.",
                  "Move only to the same or next column of the following row.",
                  "Add the current value to the cheaper complete suffix.",
                  "Cache by cell, or start from the bottom row and fold upward."
            ],
            "skeleton": "cost(row,col) = value(row,col) + min(\n  cost(row+1,col),\n  cost(row+1,col+1)\n)"
      },
      "CherryPickUpII": {
            "prompt": "Before reading: why is (row,c1,c2) sufficient, and how many paired transitions leave each state?",
            "steps": [
                  "Both robots always occupy the same row, so carry one row and two columns.",
                  "Count the current cell once when their columns match; otherwise count both.",
                  "Try each robot's three shifts independently for nine pairs.",
                  "Cache the best suffix for every column pair, or fill the same states upward from the last row."
            ],
            "skeleton": "cherries(row,c1,c2) + max over d1,d2 in {-1,0,1} of\n  solve(row+1,c1+d1,c2+d2)"
      },
      "BestTimeToBuySellStocks": {
            "prompt": "Before reading: for today as the selling day, what single fact about all earlier days is sufficient?",
            "steps": [
                  "Treat the current price as a possible selling price.",
                  "Compare it with the cheapest price seen on an earlier day.",
                  "Keep the largest resulting profit.",
                  "Update the running minimum for later selling days."
            ],
            "skeleton": "minSoFar = prices[0]\nbest = 0\nfor each later price\n  best = max(best, price - minSoFar)\n  minSoFar = min(minSoFar, price)\nreturn best"
      },
      "BestTimeToBuyAndSellStockII": {
            "prompt": "Before reading: why does canBuy replace the exact purchase-day index in the memo state?",
            "steps": [
                  "Use the day and whether buying is allowed as the complete state.",
                  "Buying records its cost by subtracting today's price.",
                  "Selling realizes value by adding today's price.",
                  "At every state, compare acting with waiting."
            ],
            "skeleton": "canBuy → max(-price + nextHolding, nextCanBuy)\nholding → max(+price + nextCanBuy, nextHolding)"
      },
      "BestTimeToBuyAndSellStockIII": {
            "prompt": "Before reading: which three changing values completely determine all future choices?",
            "steps": [
                  "Carry the day, canBuy/holding flag, and completed-sale count.",
                  "Buying subtracts price and leaves count unchanged.",
                  "Selling adds price and increments count.",
                  "Stop once two sales are complete, and compare every action with waiting."
            ],
            "skeleton": "state = (i,canBuy,count)\nbuy → (i+1,holding,count)\nsell → (i+1,canBuy,count+1)\nwait → (i+1,same,count)"
      },
      "BestTimeToBuyAndSellStockIV": {
            "prompt": "Before reading: which three state values change, and which one is bounded by k?",
            "steps": [
                  "Carry the day, holding state, and completed-sale count.",
                  "Buying subtracts price without changing count.",
                  "Selling adds price and advances count.",
                  "Stop at k sales; size the count dimension from k."
            ],
            "skeleton": "state = (i,canBuy,count)\nbuy → (i+1,holding,count)\nsell → (i+1,canBuy,count+1)\nstop when count == k"
      },
      "BestTimeToBuySellCooldown": {
            "prompt": "Before reading: which transition must skip an extra day?",
            "steps": [
                  "Carry only the day and whether buying is allowed.",
                  "Buying moves to the next day while holding.",
                  "Selling realizes profit and skips the cooldown day.",
                  "Compare each action with waiting."
            ],
            "skeleton": "canBuy → max(-price + nextHolding, wait)\nholding → max(+price + state at i+2, wait)"
      },
      "BestTimeToBuyAndSellWithFee": {
            "prompt": "Before reading: where can the fee be charged so each transaction pays it exactly once?",
            "steps": [
                  "Carry only the day and whether buying is allowed.",
                  "Buying subtracts today's price.",
                  "Selling adds today's price and subtracts the fee.",
                  "Compare every action with waiting."
            ],
            "skeleton": "canBuy → max(-price + nextHolding, wait)\nholding → max(price - fee + nextCanBuy, wait)"
      },
      "SubsetSumEqualsTarget": {
            "prompt": "Before reading: what do i and remaining target represent, and what are the two branches?",
            "steps": [
                  "Carry the current index and remaining target.",
                  "Skip the value without changing the target.",
                  "Pick the value once and subtract it from the target.",
                  "Return true as soon as the remaining target reaches zero."
            ],
            "skeleton": "possible(i,k) = possible(i+1,k) OR possible(i+1,k-arr[i])\nbase: k == 0 → true"
      },
      "PartitionEqualSubsetSum": {
            "prompt": "Before reading: why does finding a subset worth total/2 prove an equal partition exists?",
            "steps": [
                  "Add all values and reject an odd total.",
                  "Set the subset-sum target to total/2.",
                  "Use the same pick-or-skip recurrence.",
                  "A found half leaves the unchosen values as the other half."
            ],
            "skeleton": "if total is odd: false\nhalf = total / 2\nreturn subsetSum(nums,half)"
      },
      "ZeroOneKnapsackTheory": {
            "prompt": "Before reading: what two choices exist for each item, and which state value changes only when the item is taken?",
            "steps": [
                  "Carry the item index and remaining capacity.",
                  "Skip the current item and preserve capacity.",
                  "Take it once only when its weight fits, then reduce capacity.",
                  "Keep the branch with greater total value."
            ],
            "skeleton": "best(i,capacity) = max(\n  best(i+1,capacity),\n  value[i] + best(i+1,capacity-weight[i]) if it fits\n)"
      },
      "OIKnapsack": {
            "prompt": "Before reading: what do i and capacity mean, and where do the pick and skip branches move?",
            "steps": [
                  "Recursion: from (i, capacity), branch to skip and to pick when the item fits.",
                  "Memoization: cache the maximum profit for every repeated (i, capacity) state.",
                  "Tabulation: initialize the no-items row to zero and fill item/capacity states bottom-up.",
                  "Return the larger of the pick and skip totals."
            ],
            "skeleton": "best(i,c) = best(i+1,c)\nif weight[i] <= c\n  best = max(best, profit[i] + best(i+1,c-weight[i]))\ncache (i,c) or fill the same table bottom-up"
      }
};

    const definingMoves = {
      "ClimbingStairs": "State = current stair i\nexact n → 1, past n → 0\nadd i+1, i+2, i+3\ncache i or fill backward",
      "FibonacciNumber": "State = Fibonacci index n\nF(n) = F(n-1) + F(n-2)\ncache repeated n values\nthen roll two previous values",
      "FrogJump": "State = minimum energy at stair i\narrive from i-1 or i-2\nadd that jump's height difference\nkeep the cheaper total",
      "FrogJumpWithKSteps": "State = minimum energy at stair i\nlook back through up to k predecessors\nadd each jump's height difference\nkeep the cheapest candidate",
      "HouseRobberI": "State = best amount from index i onward\npick: nums[i] + rob(i+2)\nskip: rob(i+1)\ncache the larger answer",
      "HouseRobberII": "Circle means first and last conflict\nsolve houses 0…n-2\nsolve houses 1…n-1\nreturn the larger result",
      "NumberFactors": "State = ways to complete remainder n\nchoose 1, 3, or 4 next\nadd ways(n-1), ways(n-3), ways(n-4)",
      "MinimumJumpsReachEnd": "State = minimum jumps remaining from i\ntry every landing i+1…i+jumps[i]\nadd one and cache the smallest result",
      "MinimumJumpsWithFee": "State = minimum fee remaining from stair i\npay fee[i] once\nchoose the cheapest of i+1, i+2, i+3\ndestination is beyond the array",
      "PaintHouse": "State = house index + previous color\nskip the previous color\nadd each allowed cost\nkeep the minimum path",
      "UniquePaths": "State = paths at grid cell (i,j)\nrecursion goes down + right\ntabulation adds above + left",
      "UniquePathsII": "State = paths at open cell (i,j)\nobstacle → 0 paths\nrecursion goes down + right\ntabulation adds above + left",
      "MinimumPathSum": "State = minimum suffix cost from (i,j)\ncurrent cell + min(down, right)\ncache only by row and column",
      "Triangle": "State = minimum suffix from (row,col)\nchoose next-row col or col+1\ncurrent value + cheaper child",
      "CherryPickUpII": "State = row + both robot columns\ncollect one cell if columns meet\ntry all 3 × 3 next-move pairs\ncache the best suffix",
      "BestTimeToBuySellStocks": "For each selling day\nsubtract the cheapest earlier price\nkeep the best single-transaction profit",
      "BestTimeToBuyAndSellStockII": "State = day + canBuy/holding\nbuy subtracts price; sell adds price\nalways compare with waiting",
      "BestTimeToBuyAndSellStockIII": "State = day + canBuy + completed sales\nbuy keeps count; sell increments it\nstop after two sales",
      "BestTimeToBuyAndSellStockIV": "State = day + canBuy + sales up to k\nbuy keeps count; sell increments it\nstop when count reaches k",
      "BestTimeToBuySellCooldown": "State = day + canBuy/holding\nbuy and wait move to i+1\nsell moves to i+2 for cooldown",
      "BestTimeToBuyAndSellWithFee": "State = day + canBuy/holding\nbuy subtracts price\nsell adds price minus one fee\ncompare both with waiting",
      "SubsetSumEqualsTarget": "State = index + remaining target\nskip keeps target\npick subtracts arr[i]\ncombine with OR",
      "PartitionEqualSubsetSum": "Odd total → impossible\neven total → target total/2\nrun pick-or-skip subset sum",
      "ZeroOneKnapsackTheory": "State = item index + remaining capacity\nskip keeps capacity\ntake once reduces capacity\nkeep the larger value",
      "OIKnapsack": "State = item index + remaining capacity\nskip keeps capacity\npick once adds profit and reduces capacity\ncache max(pick, skip)"
};

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderVisual(groups) {
      return groups.map((group, index) => {
        const color = index === 0 ? "green" : index === 1 ? "gold" : "blue";
        return `<div class="array">${group.map(item => `<span class="cell ${color}">${escapeHtml(item)}</span>`).join("")}</div>`;
      }).join("");
    }

    function renderSteps(steps) {
      return `<div class="steps">${steps.map((step, index) => `
        <div class="step"><span class="step-num">${index + 1}</span><span>${escapeHtml(step)}</span></div>
      `).join("")}</div>`;
    }

    function storageKey(cardName) {
      return `dsa-revision:dynamicprogramming:${cardName}`;
    }

    function readRevision(cardName) {
      try {
        const raw = localStorage.getItem(storageKey(cardName));
        if (!raw) return { count: 0, last: "" };
        const parsed = JSON.parse(raw);
        return {
          count: Number(parsed.count) || 0,
          last: typeof parsed.last === "string" ? parsed.last : ""
        };
      } catch {
        return { count: 0, last: "" };
      }
    }

    function writeRevision(cardName, revision) {
      try {
        localStorage.setItem(storageKey(cardName), JSON.stringify(revision));
      } catch {
        // Keep the page usable even if browser storage is unavailable.
      }
    }

    function formatLastRevised(value) {
      if (!value) return "Last revised: never";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return `Last revised: ${value}`;
      return `Last revised: ${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
    }

    function todayLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

              <div class="section brute-force">
                <b>Brute force / baseline</b>
                ${escapeHtml(bruteForce)}
              </div>
              <div class="section alternates">
                <b>Alternate approaches</b>
                <ul class="gotchas">${alternates.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
              <div class="section full">
                <b>Bug magnets</b>
                <ul class="gotchas">${card.gotchas.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderQuickReview(cardsToRender) {
      return `<div class="quick-review">${cardsToRender.map(card => {
        if (card.referenceOnly) {
          return `<div class="quick-item">${renderTheoryCard(card)}</div>`;
        }

        const expanded = expandedQuickCards.has(card.name);
        return `
          <div class="quick-item">
            <article class="quick-row ${escapeHtml(card.difficulty.toLowerCase())} ${card.isTheory ? "theory" : ""} ${expanded ? "expanded" : ""}" data-expand-card="${escapeHtml(card.name)}" role="button" tabindex="0" aria-expanded="${expanded}">
              <span class="expand-cue" aria-hidden="true">⌄</span>
              <div>
                <div class="quick-title">
                  <strong><span class="problem-no">${escapeHtml(card.problemLabel)}</span> ${escapeHtml(card.name)}</strong>
                  <span class="difficulty ${escapeHtml(card.difficulty.toLowerCase())}">${escapeHtml(card.difficulty)}</span>
                </div>
                ${renderRevisionControls(card)}
                <div class="quick-summary">
                  <span class="quick-approach">${escapeHtml(card.label)}</span>
                  ${card.variantLens ? `<span class="quick-variant"><b>Variant</b> ${escapeHtml(card.variantLens)}</span>` : ""}
                  <div class="quick-facts">
                    <span class="quick-fact"><b>Time</b> ${escapeHtml(card.time)}</span>
                    <span class="quick-fact"><b>Space</b> ${escapeHtml(card.space)}</span>
                  </div>
                  <span class="quick-uses"><b>Uses</b> ${escapeHtml(card.structures)}</span>
                </div>
              </div>
              <div>
                <span class="quick-label">Recall prompt</span>
                <span class="quick-text">${escapeHtml(card.prompt)}</span>
              </div>
              <div>
                <span class="quick-label">Defining move</span>
                <code>${escapeHtml(card.definingMove)}</code>
              </div>
              <div>
                <span class="quick-label">Bug magnet</span>
                <span class="quick-text">${escapeHtml(card.gotchas[0])}</span>
              </div>
            </article>
            ${expanded ? renderFullCard(card, "quick-expanded-card") : ""}
          </div>
        `;
      }).join("")}</div>`;
    }

    function toggleQuickCard(cardName) {
      if (expandedQuickCards.has(cardName)) {
        expandedQuickCards.delete(cardName);
      } else {
        expandedQuickCards.add(cardName);
      }
      render();
    }

    function setReviewMode(nextQuickMode) {
      quickMode = nextQuickMode;
      quickModeEl.classList.toggle("active", quickMode);
      quickModeEl.textContent = quickMode ? "Card Review" : "Quick Review";
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = cards.filter(card => {
        const haystack = [
          card.name,
          card.problemLabel,
          card.label,
          card.difficulty,
          card.time,
          card.space,
          card.structures,
          card.leetcode,
          card.source,
          card.description,
          card.input,
          card.output,
          card.recognize,
          card.visualText,
          card.core,
          card.prompt,
          card.skeleton,
          (card.steps || []).join(" "),
          (card.gotchas || []).join(" ")
        ].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });

      if (quickMode) {
        cardsEl.className = "quick-review";
        cardsEl.innerHTML = renderQuickReview(visible);
        emptyEl.style.display = visible.length ? "none" : "block";
        return;
      }

      cardsEl.className = "cards";
      cardsEl.innerHTML = visible.map(card => renderFullCard(card)).join("");

      emptyEl.style.display = visible.length ? "none" : "block";
    }

    searchEl.addEventListener("input", render);
    cardsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action][data-card]");
      if (button) {
        const cardName = button.dataset.card;
        if (button.dataset.action === "increment") {
          const current = readRevision(cardName);
          writeRevision(cardName, {
            count: current.count + 1,
            last: todayLocalDate()
          });
        }
        if (button.dataset.action === "reset") {
          writeRevision(cardName, { count: 0, last: "" });
        }
        render();
        return;
      }
      const quickRow = event.target.closest("[data-expand-card]");
      if (quickRow) toggleQuickCard(quickRow.dataset.expandCard);
    });
    cardsEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const quickRow = event.target.closest("[data-expand-card]");
      if (!quickRow || event.target.closest("button, a")) return;
      event.preventDefault();
      toggleQuickCard(quickRow.dataset.expandCard);
    });
    incrementAllEl.addEventListener("click", () => {
      const today = todayLocalDate();
      cards.forEach(card => {
        const current = readRevision(card.name);
        writeRevision(card.name, {
          count: current.count + 1,
          last: today
        });
      });
      render();
    });
    resetAllEl.addEventListener("click", () => {
      if (!window.confirm("Reset revision counts and dates for all dynamic programming problems?")) return;
      cards.forEach(card => writeRevision(card.name, { count: 0, last: "" }));
      render();
    });
    quickModeEl.addEventListener("click", () => {
      setReviewMode(!quickMode);
      render();
    });
    exportPdfEl.addEventListener("click", () => {
      const previousQuickMode = quickMode;
      const previousSearch = searchEl.value;
      const previousExpanded = new Set(expandedQuickCards);

      searchEl.value = "";
      expandedQuickCards.clear();
      setReviewMode(false);
      render();

      const restoreAfterPrint = () => {
        searchEl.value = previousSearch;
        expandedQuickCards.clear();
        previousExpanded.forEach(name => expandedQuickCards.add(name));
        setReviewMode(previousQuickMode);
        render();
        window.removeEventListener("afterprint", restoreAfterPrint);
      };

      window.addEventListener("afterprint", restoreAfterPrint);
      window.setTimeout(() => window.print(), 50);
    });
    const countLabel = cards.every(card => card.referenceOnly) ? "reference" : "problem";
    totalCountEl.textContent = `${cards.length} ${countLabel}${cards.length === 1 ? "" : "s"}`;
    render();
  </script>
</body>
</html>
